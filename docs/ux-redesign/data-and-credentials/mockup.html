<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secrets &amp; Data Sources Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable mockups for yaaf's project Data & credentials settings: a compact variables list, an edit drawer, an access map, .env import, and data sources with honest health.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: yaaf's own shell (rail, Details tabs, settings sub-nav) with one quiet list per
   page and a right-hand drawer for every edit. Tokens are lifted from web/src/styles.css
   unchanged, dark-first exactly like the app, so this is a re-arrangement, not a repaint. */
:root {
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-micro: 12px; --t-small: 13px; --t-body: 14px; --t-lead: 15px; --t-h3: 16px; --t-h2: 20px; --t-h1: 30px;
  --radius: 10px; --radius-sm: 7px; --radius-lg: 14px;
  --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 120ms;

  color-scheme: dark;
  --page: #141312; --surface: #1c1b19; --surface-2: #232120; --sunken: #121110; --rail: #171615;
  --ink: #f5f3ee; --ink-2: #b5b1a6; --muted: #8c887d;
  --border: #2e2c28; --border-strong: #413e38;
  --accent: #8ca0f0; --accent-rgb: 140, 160, 240; --on-accent: #14161f;
  --good: #4fc48c; --good-rgb: 79, 196, 140;
  --warning: #e0ac36; --warning-rgb: 224, 172, 54;
  --critical: #f0736b; --critical-rgb: 240, 115, 107;
  --hover: rgba(255, 255, 255, 0.035); --hover-strong: rgba(255, 255, 255, 0.065);
  --scrim: rgba(0, 0, 0, 0.55);
  --e2: 0 2px 4px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
  --e3: 0 18px 48px rgba(0, 0, 0, 0.55);
  --c0: #8c887d; --c1: #6884ea; --c2: #c96e48; --c3: #1e96a8; --c4: #a98120; --c5: #a570db;
  --note: #f2c94c; --note-ink: #1a1917;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #faf9f5; --surface: #ffffff; --surface-2: #f7f5ef; --sunken: #f2f0ea; --rail: #f4f2ec;
    --ink: #1a1917; --ink-2: #56534b; --muted: #757166;
    --border: #e5e2d9; --border-strong: #d0ccc0;
    --accent: #3355cc; --accent-rgb: 51, 85, 204; --on-accent: #ffffff;
    --good: #12704a; --good-rgb: 18, 112, 74;
    --warning: #8a5a00; --warning-rgb: 138, 90, 0;
    --critical: #b3261e; --critical-rgb: 179, 38, 30;
    --hover: rgba(26, 25, 23, 0.035); --hover-strong: rgba(26, 25, 23, 0.065);
    --scrim: rgba(26, 25, 23, 0.35);
    --e2: 0 2px 4px rgba(26, 25, 23, 0.05), 0 8px 20px rgba(26, 25, 23, 0.07);
    --e3: 0 18px 48px rgba(26, 25, 23, 0.18);
    --c0: #757166; --c1: #3355cc; --c2: #c2643e; --c3: #00a0b0; --c4: #a07a00; --c5: #8e4ec6;
    --note: #f2c94c; --note-ink: #1a1917;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #faf9f5; --surface: #ffffff; --surface-2: #f7f5ef; --sunken: #f2f0ea; --rail: #f4f2ec;
  --ink: #1a1917; --ink-2: #56534b; --muted: #757166;
  --border: #e5e2d9; --border-strong: #d0ccc0;
  --accent: #3355cc; --accent-rgb: 51, 85, 204; --on-accent: #ffffff;
  --good: #12704a; --good-rgb: 18, 112, 74;
  --warning: #8a5a00; --warning-rgb: 138, 90, 0;
  --critical: #b3261e; --critical-rgb: 179, 38, 30;
  --hover: rgba(26, 25, 23, 0.035); --hover-strong: rgba(26, 25, 23, 0.065);
  --scrim: rgba(26, 25, 23, 0.35);
  --e2: 0 2px 4px rgba(26, 25, 23, 0.05), 0 8px 20px rgba(26, 25, 23, 0.07);
  --e3: 0 18px 48px rgba(26, 25, 23, 0.18);
  --c0: #757166; --c1: #3355cc; --c2: #c2643e; --c3: #00a0b0; --c4: #a07a00; --c5: #8e4ec6;
  --note: #f2c94c; --note-ink: #1a1917;
}

* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: var(--t-body);
  line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: var(--t-small); }
.micro { font-size: var(--t-micro); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── prototype bar (not part of the product) ─────────────────────────── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sunken); }
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sunken);
  border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-in { display: flex; align-items: center; gap: 14px; min-height: 48px; }
.proto-tag { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
.proto-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.proto-tabs button { border: 0; background: none; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--ink-2);
  font-size: var(--t-small); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.proto-tabs button:hover { background: var(--hover-strong); color: var(--ink); }
.proto-tabs button[aria-current="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong); }
.proto-tabs .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ── app shell ──────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 48px); }
.rail { background: var(--rail); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.logo { font-family: var(--font-display); font-size: 28px; line-height: 1; padding: 0 8px 14px; }
.logo span { color: var(--accent); }
.rail .sec { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 4px; }
.rail a { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: var(--radius-sm); color: var(--ink-2); text-decoration: none; font-size: var(--t-small); }
.rail a.on { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.proj { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 4px 0 6px; }
.proj .av { width: 26px; height: 26px; border-radius: 7px; background: rgba(var(--accent-rgb), 0.16); color: var(--accent); font-size: 11px; font-weight: 650; display: grid; place-items: center; }
.proj b { font-size: var(--t-small); display: block; }
.proj small { color: var(--muted); font-size: 11.5px; }

.main { padding-block: 18px 80px; padding-left: max(16px, min(32px, 3vw)); padding-right: max(16px, min(32px, 3vw)); min-width: 0; }
.crumbs { font-size: var(--t-small); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs b { color: var(--ink); font-weight: 600; }
.page-h { font-family: var(--font-display); font-size: var(--t-h1); font-weight: 400; margin-top: 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs span { padding: 9px 12px; color: var(--ink-2); font-size: var(--t-lead); white-space: nowrap; }
.tabs span.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }

.settings { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 28px; margin-top: 24px; }
.subnav { display: flex; flex-direction: column; gap: 1px; }
.subnav .g { font-size: var(--t-micro); color: var(--muted); padding: 12px 10px 4px; }
.subnav .g:first-child { padding-top: 0; }
.subnav button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-size: var(--t-body); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.subnav button:hover { background: var(--hover-strong); }
.subnav button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.subnav .new { font-size: 10.5px; font-weight: 600; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.4); border-radius: 99px; padding: 0 6px; }
.dotcount { min-width: 18px; height: 18px; border-radius: 9px; background: var(--warning); color: var(--page); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 5px; }

/* ── page header + toolbar ──────────────────────────────────────────── */
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.15; }
.ph p { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-sm); padding: 7px 12px; font-size: var(--t-small); font-weight: 550; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background var(--fast) var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover-strong); color: var(--ink); }
.btn.danger-text { border-color: transparent; background: none; color: var(--critical); padding-left: 4px; }
.btn.danger { background: var(--critical); color: var(--page); border-color: transparent; }
.btn.sm { padding: 4px 9px; font-size: var(--t-micro); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: var(--radius-sm); border: 0; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--hover-strong); color: var(--ink); }
svg.i { width: 15px; height: 15px; flex: none; }

.toolbar { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 7px 10px 7px 32px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--t-small); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
select.sel { padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); font-size: var(--t-small); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 5px; font-size: var(--t-small); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong); font-weight: 600; }

/* callout for an agent's request */
.ask { margin-top: 18px; display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: var(--radius); border: 1px solid rgba(var(--warning-rgb), 0.45); background: rgba(var(--warning-rgb), 0.08); flex-wrap: wrap; }
.ask .t { flex: 1 1 260px; min-width: 0; }
.ask b { font-weight: 600; }

/* ── variables list ─────────────────────────────────────────────────── */
.list { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.lrow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.05fr) minmax(0, 1.15fr) 84px 36px; gap: 16px; align-items: center; padding: 11px 14px 11px 16px; border-top: 1px solid var(--border); }
.lrow:first-child { border-top: 0; }
.lhead { font-size: var(--t-micro); color: var(--muted); padding-block: 8px; background: var(--surface-2); }
.lrow.click { cursor: pointer; transition: background var(--fast) var(--ease); }
.lrow.click:hover { background: var(--hover); }
.lrow.sel { background: rgba(var(--accent-rgb), 0.07); box-shadow: inset 3px 0 0 var(--accent); }
.vname { display: flex; gap: 10px; align-items: center; min-width: 0; }
.kind { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); }
.kind.secret { color: var(--accent); }
.vname .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vname .sub { font-size: var(--t-micro); color: var(--muted); }
.val { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.val .dots { letter-spacing: 1px; color: var(--muted); }
.upd { font-size: var(--t-micro); color: var(--muted); }

.chips { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--t-micro); color: var(--ink); white-space: nowrap; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.chip.more { color: var(--muted); }
.chip.none { border-color: rgba(var(--warning-rgb), 0.5); color: var(--warning); background: rgba(var(--warning-rgb), 0.08); }
.chip.lock { color: var(--muted); }
.chip.good { color: var(--good); border-color: rgba(var(--good-rgb), 0.4); background: rgba(var(--good-rgb), 0.08); }
.chip.warn { color: var(--warning); border-color: rgba(var(--warning-rgb), 0.45); background: rgba(var(--warning-rgb), 0.08); }
.chip.bad { color: var(--critical); border-color: rgba(var(--critical-rgb), 0.45); background: rgba(var(--critical-rgb), 0.08); }
.chip.acc { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.4); background: rgba(var(--accent-rgb), 0.08); }

.group-row { display: flex; gap: 10px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--border); background: var(--surface-2); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.group-row:hover { background: var(--hover-strong); }
.group-row .chev { transition: transform var(--fast) var(--ease); color: var(--muted); }
.group-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.lrow.managed .nm { color: var(--ink-2); }
.link { color: var(--accent); text-decoration: none; font-size: var(--t-small); background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }
.foot-note { margin-top: 10px; font-size: var(--t-micro); color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* ── access map ─────────────────────────────────────────────────────── */
.mapwrap { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow-x: auto; }
table.map { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; }
.map th, .map td { border-bottom: 1px solid var(--border); padding: 9px 10px; text-align: center; font-weight: 400; }
.map thead th { background: var(--surface-2); vertical-align: bottom; }
.map th.rowh { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 240px; padding-left: 16px; }
.map thead th.rowh { background: var(--surface-2); }
.map .team-h { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.map .team-h b { font-size: var(--t-small); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.map .team-h small { color: var(--muted); font-size: 11.5px; }
.map tr.sect th { text-align: left; font-size: var(--t-micro); color: var(--muted); background: var(--surface-2); padding: 6px 16px; position: sticky; left: 0; }
.map tr:last-child td, .map tr:last-child th { border-bottom: 0; }
.map td.tot { font-size: var(--t-micro); color: var(--muted); text-align: right; padding-right: 16px; white-space: nowrap; }
.map th.colhot, .map td.colhot { background: rgba(var(--accent-rgb), 0.06); }
.cell { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--border-strong); background: none; display: inline-grid; place-items: center; color: transparent; transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.cell:hover { border-color: var(--accent); }
.cell[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cell.changed { box-shadow: 0 0 0 3px rgba(var(--warning-rgb), 0.55); }
.cell.lockd { opacity: 0.45; cursor: not-allowed; }

.savebar { position: sticky; z-index: 3; bottom: max(14px, env(safe-area-inset-bottom, 0px)); margin-top: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-radius: var(--radius); background: var(--ink); color: var(--page); box-shadow: var(--e3); flex-wrap: wrap; }
.savebar .btn { background: transparent; color: var(--page); border-color: rgba(128, 128, 128, 0.5); }
.savebar .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.savebar .what { font-size: var(--t-small); min-width: 0; flex: 1 1 300px; }

/* ── data sources ───────────────────────────────────────────────────── */
.src { display: grid; grid-template-columns: 150px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 18px; align-items: start; padding: 14px 16px; border-top: 1px solid var(--border); }
.src:first-child { border-top: 0; }
.status { display: flex; gap: 8px; align-items: flex-start; font-size: var(--t-small); font-weight: 600; }
.status .sd { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
.status small { display: block; font-weight: 400; color: var(--muted); font-size: var(--t-micro); }
.src .nm { font-family: var(--mono); font-weight: 600; font-size: 13.5px; }
.src .host { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.src .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.src .acts { display: flex; gap: 6px; align-items: center; }
.why { grid-column: 2 / -1; font-size: var(--t-small); color: var(--ink-2); padding: 9px 12px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); margin-top: -4px; }
.why code { color: var(--muted); font-size: 11.5px; }
.why.bad { border-color: rgba(var(--critical-rgb), 0.35); }
.why.warn { border-color: rgba(var(--warning-rgb), 0.4); }

/* ── drawer ─────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; animation: fade 160ms var(--ease); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100%); z-index: 21; background: var(--surface); border-left: 1px solid var(--border-strong); box-shadow: var(--e3); display: flex; flex-direction: column; animation: slide 200ms var(--ease); }
@keyframes fade { from { opacity: 0.4; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0.6; } }
.dh { padding: calc(18px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.dh .t { flex: 1; min-width: 0; }
.dh h3 { font-family: var(--mono); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.dh h3.plain { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.dh p { color: var(--muted); font-size: var(--t-small); margin-top: 2px; }
.db { padding: 18px calc(20px + env(safe-area-inset-right, 0px)) 24px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 22px; }
.df { padding: 12px calc(20px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--surface); }
.df .sp { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; }

.inp { width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--sunken); font-size: var(--t-body); }
.inp.mono { font-family: var(--mono); font-size: 13px; }
textarea.inp { resize: vertical; min-height: 90px; line-height: 1.5; }
.valbox { display: flex; gap: 6px; align-items: center; padding: 6px 6px 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--sunken); }
.valbox .v { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.logged { font-size: var(--t-micro); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kinds button { border: 1px solid var(--border-strong); background: var(--sunken); border-radius: var(--radius-sm); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.kinds button b { font-size: var(--t-small); display: inline-flex; gap: 6px; align-items: center; }
.kinds button span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.kinds button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: rgba(var(--accent-rgb), 0.06); }

.who { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.who-row:first-child { border-top: 0; }
.who-row:hover { background: var(--hover); }
.who-row .tn { font-weight: 600; font-size: var(--t-small); display: inline-flex; gap: 6px; align-items: center; }
.who-row .pp { font-size: var(--t-micro); color: var(--muted); }
.who-row .grow { flex: 1; min-width: 0; }
.who-row .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; white-space: nowrap; }
.who-row .tag.ask { color: var(--warning); border-color: rgba(var(--warning-rgb), 0.5); display: inline; margin: 0; padding: 0 7px; background: none; }
.sw { width: 32px; height: 18px; border-radius: 9px; background: var(--border-strong); position: relative; flex: none; transition: background var(--fast) var(--ease); border: 0; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform var(--fast) var(--ease); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(14px); }
.who-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.reach { font-size: var(--t-small); color: var(--ink-2); padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-2); }
.reach.none { color: var(--warning); background: rgba(var(--warning-rgb), 0.08); }
.hist { display: flex; flex-direction: column; gap: 7px; font-size: var(--t-small); color: var(--ink-2); }
.hist div { display: flex; gap: 10px; }
.hist time { color: var(--muted); font-size: var(--t-micro); min-width: 62px; padding-top: 1px; font-variant-numeric: tabular-nums; }
.confirm { border: 1px solid rgba(var(--critical-rgb), 0.45); background: rgba(var(--critical-rgb), 0.07); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: var(--t-small); }
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 20px; }
.dtabs button { border: 0; background: none; padding: 9px 4px; margin-right: 14px; font-size: var(--t-small); color: var(--ink-2); }
.dtabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }

.parsed { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.prow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 104px; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); font-size: var(--t-small); }
.prow:first-child { border-top: 0; background: var(--surface-2); font-size: var(--t-micro); color: var(--muted); }
.prow .k { font-family: var(--mono); font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.prow .v { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow select { padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--sunken); font-size: var(--t-micro); }

.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.radio-cards button { text-align: left; border: 1px solid var(--border-strong); background: var(--sunken); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.radio-cards button b { font-size: var(--t-small); }
.radio-cards button span { font-size: var(--t-micro); color: var(--muted); line-height: 1.4; }

.detect { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid rgba(var(--good-rgb), 0.4); background: rgba(var(--good-rgb), 0.07); font-size: var(--t-small); }
.detect svg { color: var(--good); margin-top: 2px; }
details.adv summary { cursor: pointer; font-size: var(--t-small); color: var(--ink-2); }

.menu { position: fixed; z-index: 30; min-width: 190px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--e2); padding: 4px; }
.menu button { width: 100%; border: 0; background: none; display: flex; gap: 9px; align-items: center; padding: 7px 10px; border-radius: 6px; font-size: var(--t-small); text-align: left; }
.menu button:hover { background: var(--hover-strong); }
.menu button.del { color: var(--critical); }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--page); padding: 9px 14px; border-radius: var(--radius); font-size: var(--t-small); box-shadow: var(--e3); max-width: calc(100% - 32px); }

.doc { padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }

.before { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; margin-top: 26px; align-items: start; }
.shot { position: sticky; top: 64px; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.shot-cap { font-size: var(--t-micro); color: var(--muted); padding: 8px 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }

.issue h3 { font-size: var(--t-h3); font-weight: 600; }
.issue p { color: var(--ink-2); margin-top: 3px; max-width: 70ch; }
.issue .fix { margin-top: 8px; font-size: var(--t-small); color: var(--good); display: flex; gap: 6px; align-items: baseline; }
.tbl { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); }
.box h3 { font-size: var(--t-h3); font-weight: 600; margin-bottom: 8px; }

.srcs { font-size: var(--t-small); color: var(--ink-2); columns: 2; column-gap: 28px; padding-left: 18px; }
.srcs li { break-inside: avoid; margin-bottom: 4px; }

/* ── responsive ─────────────────────────────────────────────────────── */

    <p>Values your agents receive as environment variables. Agents see the name, never the value. Changes reach a team on its next run.</p></div>

function visibleVars() {

    (!S.q || v.name.includes(S.q.toLowerCase()) || env(v.name).includes(S.q.toUpperCase())) &&
    (!S.filter || v.teams.includes(S.filter)));
}
function listView() {

    ${note("<b>Managed values stop being a mystery.</b> Today a data source's URL and token are silently removed from this list, so “where is MCP_AMAZON_ADS_TOKEN?” has no answer on screen. They are listed, locked, and point to the page that owns them (Vercel, Heroku and Infisical do the same).")}`;
}

/* access map */
function mapView() {
  const d = S.data;
  const cols = TEAMS;
  const key = (t, i, s) => `${t}:${i}:${s}`;
  const isOn = (t, i, s) => { const base = (t === "v" ? d.vars[i] : d.sources[i]).teams.includes(s); return S.pending[key(t, i, s)] ? !base : base; };
  const cell = (t, i, s) => { const k = key(t, i, s); const on = isOn(t, i, s);
    const label = `${(t === "v" ? env(d.vars[i].name) : d.sources[i].name)} for ${team(s).name}`;
    return `<td class="${S.hot === s ? "colhot" : ""}"><button class="cell ${S.pending[k] ? "changed" : ""}" aria-pressed="${on}" data-cell="${k}" aria-label="${esc(label)}">${ic("check", 14)}</button></td>`; };
  const tot = (t, i) => { const n = people(cols.filter((c) => isOn(t, i, c.slug)).map((c) => c.slug)).length; return `<td class="tot">${n ? n + (n === 1 ? " person" : " people") : '<span style="color:var(--warning)">nobody</span>'}</td>`; };
  const vrows = visibleVars().map(({ v, i }) => `<tr><th class="rowh"><div class="vname"><span class="kind ${v.kind}">${ic(kindIcon(v.kind), 13)}</span><span class="nm">${env(v.name)}</span></div></th>${cols.map((c) => cell("v", i, c.slug)).join("")}${tot("v", i)}</tr>`).join("");
  const srows = d.sources.map((s, i) => `<tr><th class="rowh"><div class="vname"><span class="kind">${ic("plug", 13)}</span><span class="nm">${s.name}</span><span class="muted micro">tools</span></div></th>${cols.map((c) => cell("s", i, c.slug)).join("")}${tot("s", i)}</tr>`).join("");
  const n = Object.keys(S.pending).length;
  const summary = Object.keys(S.pending).map((k) => { const [t, i, s] = k.split(":"); const on = isOn(t, +i, s); const what = t === "v" ? env(d.vars[+i].name) : d.sources[+i].name + "'s tools"; return `${team(s).name} ${on ? "gets" : "loses"} ${what}`; });
  return `<div class="mapwrap"><table class="map">
    <thead><tr><th class="rowh"><span class="small muted">Click a square to give or take away. Nothing saves until you press Save.</span></th>${cols.map((c) => `<th class="${S.hot === c.slug ? "colhot" : ""}"><button class="team-h" style="border:0;background:none" data-hot="${c.slug}" title="Highlight this column"><b><span class="chip" style="padding:0;border:0;background:none"><span class="d" style="background:var(${c.c})"></span></span>${esc(c.name)}</b><small>${esc(c.people.join(", "))}</small></button></th>`).join("")}<th></th></tr></thead>
    <tbody><tr class="sect"><th colspan="${cols.length + 2}">Your variables</th></tr>${vrows}
    <tr class="sect"><th colspan="${cols.length + 2}">Data sources (their address and token travel together)</th></tr>${srows}</tbody></table></div>
    ${n ? `<div class="savebar" role="status"><div class="what"><b>${n} unsaved ${n === 1 ? "change" : "changes"}.</b> ${esc(summary.join(" · "))}</div><div class="btns"><button class="btn" data-act="discard">Discard</button><button class="btn primary" data-act="savemap">Save ${n} ${n === 1 ? "change" : "changes"}</button></div></div>` : ""}
    ${note("<b>The question nobody can answer today: what does the Data team get?</b> Answering it now means scrolling 5,000px and reading 35 cards. The map shows every grant on one screen, variables and data sources together, with people under each team. Changes stage with an amber ring and save as one batch (Railway and Fly stage changes the same way), so a stray click can no longer hand a secret to someone on the spot. Today every grant checkbox saves the instant it is ticked.")}`;
}

    <div class="list" style="margin-top:12px">${rows}</div>
    ${note("<b>Health in words, with the next step beside it.</b> Today all four rows read “unreachable” in red and the Notion row shows two badges that disagree. Each state now has one label and one button: <b>Can't connect</b> (Test again), <b>Needs sign-in</b> (Connect), <b>Offers no tools</b> (the trap where a dot is green but agents have nothing to call; Cursor users report it), <b>Working</b>. The raw error stays in small mono for whoever debugs it.")}

/* ── drawers ── */
function whoPicker(selected, opts = {}) {
  const rows = TEAMS.map((t) => {
    const on = selected.includes(t.slug);
    return `<div class="who-row" data-toggle="${t.slug}" role="switch" aria-checked="${on}" tabindex="0">
      <span class="sw" aria-checked="${on}"></span>
      <span class="grow"><span class="tn"><span class="chip" style="padding:0;border:0;background:none"><span class="d" style="background:var(${t.c})"></span></span>${esc(t.name)}</span> <span class="pp">${esc(t.people.join(", "))}</span></span>
      ${opts.asked === t.slug ? '<span class="tag ask">asked for this</span>' : ""}${t.ceo ? '<span class="tag">plans, does not build</span>' : ""}
    </div>`;
  }).join("");
  const reached = people(selected);
  const what = opts.what || "it";
  const reach = reached.length ? `<div class="reach">${esc(listJoin(reached))} ${reached.length === 1 ? "gets" : "get"} ${what} on ${reached.length === 1 ? "their" : "their"} next run. Nobody else does.</div>`
    : `<div class="reach none">Nobody gets ${what} yet. It is stored, but no sandbox receives it until you switch a team on.</div>`;
  return `<div class="fld"><div class="who-head"><span class="lbl">Who gets it</span><button class="link" data-act="allteams">${selected.length === TEAMS.length ? "Clear all" : "Every team"}</button></div><div class="who">${rows}</div>${reach}</div>`;
}

function varDrawer() {
  const D = S.drawer, v = D.draft, orig = S.data.vars[D.idx];

  let valueUI;
  if (v.kind === "file") valueUI = `<div class="valbox"><span class="v">${ic("file", 13)} ${esc(v.filename)} <span class="muted">· ${v.size}</span></span><button class="btn sm">Replace file</button></div><div class="hint">Agents get <code>$${env(v.name)}</code> holding the path <code>/run/secrets/${esc(v.filename)}</code>, never the contents.</div>`;
  else if (D.replacing) valueUI = `<textarea class="inp mono" id="newval" rows="3" placeholder="Paste the new value">${esc(D.newval || "")}</textarea><div class="hint">The old value is replaced when you save. Granted teams get the new one on their next run.</div>`;
  else if (v.kind === "secret" && !D.revealed) valueUI = `<div class="valbox"><span class="v"><span class="dots muted">••••••••••••</span>${esc(v.hint)}</span><button class="btn sm" data-act="reveal">${ic("eye", 13)} Reveal</button><button class="btn sm" data-act="replace">Replace</button></div><div class="logged">${ic("lock", 11)} Revealing is logged to Activity, one entry per press.</div>`;
  else valueUI = `<div class="valbox"><span class="v">${esc(v.value)}</span><button class="btn sm" data-act="copy">${ic("copy", 13)} Copy</button>${v.kind === "secret" ? `<button class="btn sm" data-act="hide">Hide</button>` : ""}<button class="btn sm" data-act="replace">Replace</button></div>${v.kind === "secret" ? `<div class="logged">${ic("check", 11)} Revealed just now. Logged to Activity.</div>` : ""}`;
  return `<div class="dh"><span class="kind ${v.kind}">${ic(kindIcon(v.kind), 14)}</span><div class="t"><h3>${env(v.name)}</h3><p>Stored as ${esc(v.name)} · added Oct 3 by you</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ic("x")}</button></div>
  <div class="db">
    <div class="fld"><span class="lbl">Type</span><div class="kinds">
      ${[["secret", "Secret", "Hidden until you reveal it"], ["plain", "Plain value", "Shown as is. For IDs and settings"], ["file", "File", "Agents get a path to it"]].map(([k, n, h]) => `<button aria-pressed="${v.kind === k}" data-kind="${k}" ${v.kind === "file" || k === "file" ? (v.kind === k ? "" : 'disabled style="opacity:.5"') : ""}><b>${ic(kindIcon(k), 13)} ${n}</b><span>${h}</span></button>`).join("")}
    </div></div>
    <div class="fld"><span class="lbl">Value</span>${valueUI}</div>
    ${whoPicker(v.teams, { what: "$" + env(v.name) })}
    <div class="fld"><span class="lbl">History</span><div class="hist">
      <div><time>Oct 21</time><span>You gave it to Data</span></div>
      <div><time>Oct 20</time><span>You revealed the value</span></div>
      <div><time>Oct 3</time><span>You added it for Analysts</span></div></div></div>
    ${D.confirm ? `<div class="confirm"><b>Delete ${env(v.name)}?</b><span>${esc(listJoin(people(orig.teams)) || "Nobody")} ${people(orig.teams).length === 1 ? "loses" : "lose"} it on their next run. This can't be undone.</span><div class="btns"><button class="btn danger" data-act="dodelete">Delete variable</button><button class="btn" data-act="nodelete">Keep it</button></div></div>` : ""}
    ${note("<b>One save model.</b> Today there are three on one page: grant checkboxes save on click, a revealed value saves with its own small button, and a data source has Save changes. In the drawer, everything waits for <b>Save changes</b>, which stays disabled until something changed. Delete moves out of every row and into the drawer, with an inline confirmation that names who loses access. The browser confirm() box is gone.")}
    ${note("<b>Plain values are a new type.</b> A timezone or an ad account ID doesn't need masking, and masking it makes every row look the same. Cloudflare, Doppler and GitLab all let you choose. This needs one new column on the server (see Research & plan). The value is still encrypted at rest either way.")}
  </div>
  <div class="df"><button class="btn danger-text" data-act="askdelete">${ic("trash", 14)} Delete</button><span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="savevar" ${dirty || D.replacing ? "" : "disabled"}>Save changes</button></div>`;
}

function parseEnv(text) {
  return text.split("\n").map((l) => l.trim()).filter((l) => l && !l.startsWith("#") && l.includes("=")).map((l) => {
    const i = l.indexOf("="); const k = l.slice(0, i).replace(/^export\s+/, "").trim(); const v = l.slice(i + 1).trim().replace(/^["']|["']$/g, "");
    const secret = /KEY|TOKEN|SECRET|PASS|PWD|PRIVATE|AUTH/i.test(k);
    const exists = S.data.vars.some((x) => env(x.name) === env(k));
    return { k: env(k), v, kind: secret ? "secret" : "plain", exists };
  });
}
function addDrawer() {
  const D = S.drawer;
  const tabs = `<div class="dtabs" role="tablist"><button role="tab" aria-selected="${D.tab === "one"}" data-tab="one">One variable</button><button role="tab" aria-selected="${D.tab === "paste"}" data-tab="paste">Paste .env</button></div>`;
  let body, foot;
  if (D.tab === "one") {
    const v = D.draft;
    body = `<div class="fld"><label for="nm">Name</label><input class="inp mono" id="nm" value="${esc(v.name)}" placeholder="SEMRUSH_API_KEY" autocomplete="off">
      <div class="hint">${v.name ? `Agents will see <code>$${env(v.name)}</code>.` : "Letters, digits and dashes. Paste several KEY=value lines here and they split into rows."}</div></div>
      <div class="fld"><span class="lbl">Type</span><div class="kinds">${[["secret", "Secret", "Hidden until you reveal it"], ["plain", "Plain value", "Shown as is. For IDs and settings"], ["file", "File", "Agents get a path to it"]].map(([k, n, h]) => `<button aria-pressed="${v.kind === k}" data-kind="${k}"><b>${ic(kindIcon(k), 13)} ${n}</b><span>${h}</span></button>`).join("")}</div></div>
      <div class="fld"><label for="vv">Value</label>${v.kind === "file" ? `<button class="btn" style="justify-content:center;padding:18px">${ic("file")} Choose a file, or drop one here</button><div class="hint">A service-account key, a PEM, a kubeconfig. Agents get the path, not the bytes.</div>` : `<textarea class="inp mono" id="vv" rows="2" placeholder="${v.kind === "secret" ? "The key itself" : "America/Toronto"}">${esc(v.value)}</textarea>`}</div>
      ${whoPicker(D.teams, { what: v.name ? "$" + env(v.name) : "it", asked: D.asked })}`;
    foot = `<span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="addone" ${v.name && (v.value || v.kind === "file") ? "" : "disabled"}>Add variable</button>`;
  } else {
    const rows = parseEnv(D.paste);
    body = `<div class="fld"><label for="paste">Paste from a .env file</label><textarea class="inp mono" id="paste" rows="6" spellcheck="false">${esc(D.paste)}</textarea><div class="hint">Lines starting with # are skipped. Nothing is stored until you press Add.</div></div>
      <div class="fld"><span class="lbl">${rows.length} found</span><div class="parsed">
        <div class="prow"><span>Name</span><span>Value</span><span>Type</span></div>
        ${rows.map((r, i) => `<div class="prow"><span class="k">${r.k} ${r.exists ? '<span class="chip warn" style="margin-left:4px">replaces</span>' : ""}</span><span class="v">${r.kind === "secret" ? "••••••••" + esc(r.v.slice(-4)) : esc(r.v)}</span><select aria-label="Type of ${r.k}"><option ${r.kind === "secret" ? "selected" : ""}>Secret</option><option ${r.kind === "plain" ? "selected" : ""}>Plain value</option></select></div>`).join("")}
      </div><div class="hint">Names with KEY, TOKEN, SECRET or PASS in them start as secrets. Change any you disagree with.</div></div>
      ${whoPicker(D.teams, { what: "these " + rows.length })}
      ${note("<b>Paste once instead of four trips through the form.</b> Vercel, Supabase, Railway and Claude Code's own environments all accept a pasted .env and split it into rows for review. The guess at secret vs plain is visible and editable, and a name that already exists is flagged before you overwrite it.")}`;
    foot = `<span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="addmany" ${rows.length ? "" : "disabled"}>Add ${rows.length} variables</button>`;
  }
  return `<div class="dh"><div class="t"><h3 class="plain">Add variables</h3><p>Encrypted when stored. Agents get the name, never the value.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ic("x")}</button></div>${tabs}<div class="db">${body}</div><div class="df">${foot}</div>`;
}

function srcDrawer() {
  const D = S.drawer;
  return `<div class="dh"><div class="t"><h3 class="plain">Add a data source</h3><p>An MCP server: an address that offers tools.</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ic("x")}</button></div>

      <div class="fld" style="margin-top:10px"><span class="lbl">Client ID and secret</span><input class="inp" placeholder="Leave blank. Most servers register yaaf automatically."></div>
    </details>
    ${note("<b>Ask for the address first and work out the rest.</b> Claude.ai's connector form does the same: you give a URL, and sign-in is detected rather than chosen from a menu you may not understand. Today's form asks for a slug, a URL, an auth mode, a read mode and roles at once, before you know whether the server even answers. The detection reuses the check that runs on save today. It needs a check-without-saving endpoint.")}
  </div>
  <div class="df"><span class="sp"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="addsrcgo" ${D.teams.length ? "" : "disabled"}>Add and sign in</button></div>`;
}

/* ── problem page ── */
function problemPage() {
  const issues = [
    ["The inventory is below two forms", "Each section opens with an empty add form, 13 fields between them. The values you already have start about 1,300px down, under a form you open maybe once a month.", "List first. Add opens a drawer from one button."],
    ["Each variable is 410px tall", "Every credential row draws all five teams as cards with people's names. Seven credentials make a 5,171px page. Ten teams would make each row about 800px.", "One 56px row. Teams as chips, people on hover. Editing in a drawer."],
    ["You can't see what a team gets", "“What can Data reach?” means scrolling the whole page and reading 35 cards, plus a second table for data sources.", "A filter, “What Data gets”, and an access map of every grant on one screen."],
    ["Three save models on one page", "A grant checkbox saves instantly. A value saves with a small button that appears after you reveal it. A data source has Save changes. One misclick hands a secret to a team with no undo.", "Everything stages and saves with one button. The map batches changes and shows what will happen."],
    ["Every value looks the same", "A timezone, an ad account ID and a refresh token all read ••••••••••••. You can't tell two keys apart without revealing both.", "Plain values shown as is. Secrets show their last four characters."],
    ["One team, three looks", "The same team appears as a card (“Data data-analyst Kim, Theo”), a checkbox (“Data (data-analyst)”) and a slug pill (“data-analyst”).", "One chip with the team's colour, the same on every page."],
    ["Health that doesn't help", "All four data sources read “unreachable” in red, with “could not connect: ProxyError” as the explanation. Notion shows “not connected” and “unreachable” at once.", "One state per source, in words, with the button that fixes it."],
    ["Buttons and paragraphs everywhere", "13 action buttons on 4 data-source rows, 7 red delete buttons, and about 220 words of explanation that describe how sandboxes work rather than what to do.", "One ⋯ menu per row. One sentence under each page title."],
    ["Hidden values with no trace", "A data source's URL and token are removed from the list on purpose, but nothing says so. The billing warning from Money shows at the top of this page.", "A locked “Set up by your data sources” group that links to its owner."],
  ];
  return `<div class="doc">
    <h1>Data &amp; credentials, today</h1>
    <p class="lede">The same project used for every screen in this mockup: Amazon PPC audit, with five teams, seven variables and four data sources. Captured from the app at 1440px wide.</p>
    <div class="stats"><div class="stat"><b>5,171px</b><span>page height for 7 variables and 4 sources</span></div><div class="stat"><b>40</b><span>team cards drawn, 5 per credential plus the add form</span></div><div class="stat"><b>3</b><span>different ways to save on one page</span></div><div class="stat"><b>~1,300px</b><span>scrolled before the first stored credential</span></div></div>
    <div class="before">
      <figure class="shot" style="margin:0"><div class="shot-scroll"><img src="${THUMB}" alt="Full-length screenshot of today's Data and credentials page: a data source table, an add form, then seven credentials each with a tall stack of team cards."></div><figcaption class="shot-cap"><span>Today's page, full length, at 33%</span><span>scrolls</span></figcaption></figure>
      <div class="issues">${issues.map(([h, p, f]) => `<div class="issue"><div><h3>${h}</h3><p>${p}</p><div class="fix">${ic("arrow", 12)} <span>${f}</span></div></div></div>`).join("")}</div>
    </div>
    <p style="margin-top:24px"><button class="btn primary" data-go="variables">See the redesign ${ic("arrow", 14)}</button></p>
  </div>`;
}

/* ── notes page ── */
function notesPage() {
  const research = [
    ["Vercel", "Redesigned its env-var list in 2025 for “less scrolling, larger hit targets, details only when you need them”. Edit and Remove sit in a row menu. Search, filter and sort sit above the list. A pasted .env splits into rows.", "Row anatomy, the ⋯ menu, .env paste"],
    ["GitHub", "Org secrets have one “Repository access” setting. The row reads “3 selected repositories” and the picker opens on demand. Secrets and plain Variables are separate types.", "Access as a summary in the row, picker in the drawer, secret vs plain"],
    ["Doppler, Infisical", "Secrets as rows, environments as columns, a tick where a value exists. Doppler logs each reveal and has three visibility levels.", "The access map, logged reveal"],
    ["Railway, Fly.io", "Edits become staged changes with a banner, applied in one step. Fly shows a short digest so you can tell values apart without seeing them.", "The save bar, the last-four hint"],
    ["Cloudflare, GitLab", "One list with a type per row: Text, JSON or Secret. Plain text shows in clear.", "The Plain value type"],
    ["Heroku, Vercel integrations", "Values an add-on or integration created show with their owner and can't be edited in place.", "The locked “Set up by your data sources” group"],
    ["Zapier, Make, Claude.ai connectors", "A connection is its own object with a state (connected, expired, error), a Verify or Reconnect button, and its token stored inside it. Claude.ai asks for the URL first and detects sign-in.", "Data sources as their own page, health in words, address-first add"],
    ["Cursor MCP settings", "Users report a green dot on a server that offers 0 tools.", "“Offers no tools” as its own warning state"],
  ];
  return `<div class="doc">
    <h1>Research &amp; plan</h1>
    <p class="lede">How products with the same problem lay out the same screen, what this redesign takes from them, what it leaves out on purpose, and what building it would cost.</p>
    <h2>What comparable products do</h2>
    <div class="tbl"><table><thead><tr><th>Product</th><th>What they do</th><th>What this design takes</th></tr></thead><tbody>
      ${research.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join("")}</tbody></table></div>
    <p class="micro muted" style="margin-top:8px">Gathered from each product's documentation and changelogs through search results; the research environment could not open pages directly, so treat specifics as a summary of their docs, not a screenshot audit.</p>

    <h2>Kept from yaaf's own rules</h2>
    <div class="cols2">
      <div class="box"><h3>Unchanged</h3><ul>
        <li><b>You can still reveal a value.</b> The server lets the chairman read their own credentials, with one audit row per press. Most hosting platforms make secrets write-only. yaaf decided against that because hiding a value costs a debugging session every time a source won't mount.</li>
        <li><b>Nobody gets anything until you switch a team on.</b> New variables start with no teams. The page says so in amber.</li>
        <li><b>Agents get names, never values.</b> Values never reach chat or model context.</li>
        <li><b>A data source is saved in one motion</b>, validated and checked, and one with no teams can't be saved.</li>
        <li><b>Managed values are edited where they belong</b>: data sources on their page, billing under Money, Slack and GitHub under Integrations.</li>
      </ul></div>
      <div class="box"><h3>Not copied on purpose</h3><ul>
        <li><b>“All roles, including future ones.”</b> GitHub offers this. Here it would hand keys to whoever is hired next without asking you. “Every team” switches on the teams that exist today, and that's all it does.</li>
        <li><b>Write-only secrets by default.</b> See the first point on the left.</li>
        <li><b>Per-environment values.</b> yaaf has no environments. The columns in the map are teams.</li>
        <li><b>References like \${{ other.KEY }}.</b> Useful, but they would be a new concept. Not needed to fix this page.</li>
      </ul></div>
    </div>

    <h2>What it costs</h2>
    <div class="tbl cost"><table><thead><tr><th>Piece</th><th>Where</th><th>Notes</th></tr></thead><tbody>
      <tr><td>Split into two pages, list rows, chips, filter, ⋯ menus, drawer</td><td>Web only</td><td>Uses today's endpoints. <code>CredentialsManager</code> and <code>DataSources</code> in <code>pages/project/Settings.tsx</code> become their own sub-pages. Old <code>?s=data</code> links redirect.</td></tr>
      <tr><td>Compact team picker</td><td>Web only</td><td>Replaces <code>RoleGrants</code> cards and <code>RoleTicks</code> with one component. The Inbox's “Fulfill the need” (<code>Decisions.tsx</code>) and the new-project wizard's data source step use it too, so the three never drift again.</td></tr>
      <tr><td>Access map with staged save</td><td>Web only</td><td>Saves as one <code>POST /admin/secrets</code> or <code>/mcp_servers</code> per changed row. A batch endpoint would make it one audited action; optional.</td></tr>
      <tr><td>Paste .env</td><td>Web only</td><td>Parses in the browser and posts each row. A batch endpoint is nicer for the audit log; optional.</td></tr>
      <tr><td>Plain value type</td><td>Server + migration</td><td>A <code>visibility</code> column on <code>Secret</code> (secret, plain). Still encrypted at rest. Plain values ride the list response; secrets keep their reveal endpoint. Touches the CLI and MCP reader that list secrets.</td></tr>
      <tr><td>Last-four hint and Updated date</td><td>Server + migration</td><td><code>hint</code> and <code>updated_at</code> columns, written on every store. Today the list returns only name, scopes, kind and filename.</td></tr>
      <tr><td>History in the drawer</td><td>Server</td><td>Reads existing audit rows for that secret. No new data.</td></tr>
      <tr><td>Source health states and address-first add</td><td>Server</td><td>Split the check result into reachable, needs sign-in, blocked by network and 0 tools. Add a check-without-saving endpoint for detection.</td></tr>
      <tr><td>Agent requests on this page</td><td>Web only</td><td>Reads the pending <code>tool_request</code> approvals the Inbox already shows.</td></tr>
    </tbody></table></div>
    <p class="small ink2" style="margin-top:12px;max-width:72ch">A sensible order: ship the web-only rows first. They fix the length, the scattered grants and the three save models without a migration. The plain type, hints and health states can follow as a second change.</p>
  </div>`;
}

/* ── render ── */
function render() {
  document.getElementById("protoTabs").innerHTML = SCREENS.map(([k, n], i) => `<button aria-current="${S.screen === k}" data-go="${k}"><span class="n">${i + 1}</span>${n}</button>`).join("");
  const root = document.getElementById("root");
  if (S.screen === "problem") root.innerHTML = problemPage();
  else if (S.screen === "notes") root.innerHTML = notesPage();
  else root.innerHTML = shell(page() === "sources" ? sourcesPage() : varsPage());
  const layer = document.getElementById("layer");
  let html = "";
  if (S.drawer) {
    const inner = S.drawer.type === "var" ? varDrawer() : S.drawer.type === "add" ? addDrawer() : srcDrawer();
    html += `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${inner}</aside>`;
  }
  if (S.menu) html += menuHTML();
  if (S.toast) html += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  layer.innerHTML = html;
  document.body.classList.toggle("notes-on", S.notes);
  document.getElementById("notesBtn").setAttribute("aria-pressed", S.notes);
}
function menuHTML() {
  const m = S.menu;
  const items = m.kind === "var"
    ? `<button data-open="${m.i}">${ic("edit", 14)} Edit</button><button data-act="copyname" data-i="${m.i}">${ic("copy", 14)} Copy $${env(S.data.vars[m.i].name)}</button><hr><button class="del" data-act="menudelete" data-i="${m.i}">${ic("trash", 14)} Delete…</button>`
    : `<button data-toast="Testing ${S.data.sources[m.i].name}…">${ic("refresh", 14)} Test connection</button><button data-act="addsrc">${ic("edit", 14)} Edit</button><button data-act="viewmap">${ic("grid", 14)} See who gets it</button><hr><button class="del" data-toast="Remove asks first, in the drawer.">${ic("trash", 14)} Remove…</button>`;
  return `<div class="menu" role="menu" style="top:${m.y}px;left:${m.x}px">${items}</div>`;
}
let toastTimer;
function toast(t) { S.toast = t; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2400); }

/* ── events ── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-open],[data-menu],[data-srcmenu],[data-view],[data-cell],[data-hot],[data-toggle],[data-kind],[data-tab],[data-read],[data-toast]");
  if (S.menu && !(t && t.closest(".menu")) && !(t && (t.dataset.menu || t.dataset.srcmenu))) { S.menu = null; if (!t) { render(); return; } }
  if (!t) return;
  const D = S.drawer, ds = t.dataset;
  if (ds.go) return go(ds.go);
  if (ds.toast) { S.menu = null; return toast(ds.toast); }
  if (ds.open !== undefined && !ds.menu) { const i = +ds.open; S.menu = null; S.drawer = { type: "var", idx: i, draft: clone(S.data.vars[i]), revealed: false, replacing: false }; return render(); }
  if (ds.menu !== undefined) { e.stopPropagation(); const r = t.getBoundingClientRect(); S.menu = { kind: "var", i: +ds.menu, x: Math.max(8, r.right - 200), y: r.bottom + 4 }; return render(); }
  if (ds.srcmenu !== undefined) { const r = t.getBoundingClientRect(); S.menu = { kind: "src", i: +ds.srcmenu, x: Math.max(8, r.right - 200), y: r.bottom + 4 }; return render(); }
  if (ds.view) { S.view = ds.view; return render(); }
  if (ds.hot) { S.hot = S.hot === ds.hot ? "" : ds.hot; return render(); }
  if (ds.cell) { S.pending[ds.cell] ? delete S.pending[ds.cell] : (S.pending[ds.cell] = true); return render(); }
  if (ds.toggle && D) {
    const list = D.type === "var" ? D.draft.teams : D.teams;
    const i = list.indexOf(ds.toggle); i >= 0 ? list.splice(i, 1) : list.push(ds.toggle); return render();
  }
  if (ds.kind && D) { if (t.disabled) return; D.draft.kind = ds.kind; return render(); }
  if (ds.tab && D) { D.tab = ds.tab; return render(); }
  if (ds.read && D) { D.read = ds.read; return render(); }
  const a = ds.act;
  const acts = {
    close() { S.drawer = null; },
    add() { S.drawer = { type: "add", tab: "one", draft: blankVar(), teams: [], paste: DOTENV }; },
    paste() { S.drawer = { type: "add", tab: "paste", draft: blankVar(), teams: [], paste: DOTENV }; },
    fulfil() { S.drawer = { type: "add", tab: "one", draft: { ...blankVar(), name: "SEMRUSH_API_KEY" }, teams: ["ppc-analyst"], asked: "ppc-analyst", paste: DOTENV }; },
    addsrc() { S.menu = null; S.drawer = { type: "addsrc", url: "https://mcp.linear.app/mcp", name: "linear", read: "inline", teams: [] }; },
    managed() { S.managedOpen = !S.managedOpen; },
    clear() { S.q = ""; S.filter = ""; },
    reveal() { D.revealed = true; },
    hide() { D.revealed = false; },
    replace() { D.replacing = true; },
    copy() { try { navigator.clipboard.writeText(D.draft.value).catch(() => {}); } catch (err) {} toast("Copied"); return true; },
    copyname() { S.menu = null; toast(`Copied $${env(S.data.vars[+ds.i].name)}`); return true; },
    menudelete() { const i = +ds.i; S.menu = null; S.drawer = { type: "var", idx: i, draft: clone(S.data.vars[i]), confirm: true }; },
    askdelete() { D.confirm = true; },
    nodelete() { D.confirm = false; },
    dodelete() { const n = env(S.data.vars[D.idx].name); S.data.vars.splice(D.idx, 1); S.drawer = null; toast(`Deleted ${n}`); return true; },
    savevar() { const nv = document.getElementById("newval"); if (nv && nv.value) { D.draft.value = nv.value; D.draft.hint = nv.value.slice(-4); } S.data.vars[D.idx] = D.draft; S.drawer = null; toast("Saved. Teams get it on their next run."); return true; },
    allteams() { const list = D.type === "var" ? D.draft.teams : D.teams; const all = list.length === TEAMS.length; list.splice(0, list.length, ...(all ? [] : TEAMS.map((x) => x.slug))); },
    addone() { const v = D.draft; S.data.vars.push({ name: v.name.toLowerCase().replace(/_/g, "-"), kind: v.kind, value: v.value, hint: v.value.slice(-4), filename: "upload.json", size: "1 KB", teams: [...D.teams], upd: "Just now" }); S.drawer = null; toast(`Added $${env(v.name)}`); return true; },
    addmany() { const rows = parseEnv(D.paste); rows.forEach((r) => { if (!r.exists) S.data.vars.push({ name: r.k.toLowerCase().replace(/_/g, "-"), kind: r.kind, value: r.v, hint: r.v.slice(-4), teams: [...D.teams], upd: "Just now" }); }); S.drawer = null; toast(`Added ${rows.length} variables`); return true; },
    addsrcgo() { S.drawer = null; toast("Saved linear. Its sign-in opened in a new tab."); return true; },
    discard() { S.pending = {}; },
    savemap() {
      Object.keys(S.pending).forEach((k) => { const [tp, i, s] = k.split(":"); const row = tp === "v" ? S.data.vars[+i] : S.data.sources[+i]; const j = row.teams.indexOf(s); j >= 0 ? row.teams.splice(j, 1) : row.teams.push(s); });
      const n = Object.keys(S.pending).length; S.pending = {}; toast(`Saved ${n} changes. They apply on each team's next run.`); return true;
    },
    viewmap() { S.menu = null; S.screen = "variables"; S.view = "map"; },
  };
  if (a && acts[a]) { if (acts[a]() !== true) render(); }
});
document.addEventListener("input", (e) => {
  const id = e.target.id, D = S.drawer;
  if (id === "q") { S.q = e.target.value; rerenderKeep(id); }
  if (id === "paste" && D) { D.paste = e.target.value; rerenderKeep(id); }
  if (id === "nm" && D) {
    if (e.target.value.includes("\n") || /=.*\n?/.test(e.target.value) && e.target.value.split("=").length > 2) { D.tab = "paste"; D.paste = e.target.value; render(); return; }
    D.draft.name = e.target.value; rerenderKeep(id);
  }
  if (id === "vv" && D) { D.draft.value = e.target.value; rerenderKeep(id); }
  if (id === "newval" && D) { D.newval = e.target.value; }
  if (id === "sn" && D) { D.name = e.target.value; rerenderKeep(id); }
});
document.addEventListener("change", (e) => { if (e.target.id === "filter") { S.filter = e.target.value; render(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.menu) S.menu = null; else S.drawer = null; render(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open],[data-toggle]")) { e.preventDefault(); e.target.click(); }
});
function rerenderKeep(id) {
  const el = document.getElementById(id); const pos = el ? el.selectionStart : null;
  render(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
}
document.getElementById("notesBtn").addEventListener("click", () => { S.notes = !S.notes; render(); });

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== S.screen && SCREENS.some(([k]) => k === h)) go(h, false); });
const start = (location.hash || "").slice(1);
go(SCREENS.some(([k]) => k === start) ? start : "variables", false);
})();
</script>
