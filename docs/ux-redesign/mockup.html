/* ═════════════ WHY THIS DESIGN ═════════════ */
function viewWhy() {
  const pat = (n, t, d) => `<div class="why-pat"><span class="why-n">${n}</span><div><b>${t}</b><p>${d}</p></div></div>`;
  const vocab = [
    ['Desk', 'Inbox', 'One place, one count'],
    ['Boardroom', 'Chat with Iris', 'Name the person, not the room'],
    ['Progress → The plan', 'Roadmap', 'Requirements keep their name'],
    ['Progress → Who is doing it', 'Tasks', 'Board, read-only'],
    ['Progress → What proves it', 'Activity → Proof', 'Evidence lives in one place'],
    ['Review (behind a banner)', 'Reviews', 'A page of its own'],
    ['Records (5 pills)', 'Activity', 'One timeline, filters'],
    ['“Who is on this” cards', 'Team (org chart)', 'Hierarchy + live work'],
    ['People you can hire', 'Role library', 'Matches the page title'],
    ['Constitution / Rules in force', 'Settings → How it runs', 'Questions, then all rules'],
    ['Drought', 'No outside proof for 14h', 'Say what it means'],
    ['Job / run / task / piece of work', 'Task (work) and Run (one attempt)', 'Two words, never four'],
  ];
  return `
  <div class="page-h"><div class="grow"><div class="eyebrow">Research summary · 12 Oct 2026</div><h1>Why this design</h1>
    <p class="sub">A redesign of yaaf’s web app, informed by a read-through of Paperclip’s product and source and a screen-by-screen audit of yaaf’s current UI. The domain, the rules and the colour tokens are unchanged; the structure and the words are what move.</p></div></div>

  <div class="why-stats">
    <div><b>14</b><span>places in today’s UI that show something needing you, with <b>3</b> different counts</span></div>
    <div><b>12</b><span>sections on today’s Overview, fed by about <b>16</b> separate pollers</span></div>
    <div><b>0</b><span>screens that show what each agent is doing right now</span></div>
    <div><b>4</b><span>words for one thing: task, job, run, “piece of work”</span></div>
  </div>

  <section class="why-sec"><h2>What Paperclip gets right</h2>
    <p class="ink2 small" style="max-width:72ch;margin-bottom:14px">Paperclip (open source, MIT) describes itself as “a task manager on the outside, an org chart and governance underneath”. Its own design rule is that every screen answers: <i>what is happening, does it need me, what do I do about it</i>. The patterns worth taking:</p>
    <div class="why-grid">
      ${pat(1, 'Familiar SaaS nouns first', 'Dashboard, Inbox, Tasks, Projects, Agents, Settings. The machinery (heartbeats, adapters) sits one level down.')}
      ${pat(2, 'One triage inbox', 'Approvals, failed runs, tasks and alerts in one list with inline verbs, unread dots, j/k keys and “Inbox zero”.')}
      ${pat(3, 'Liveness is ambient', 'Running agents are listed in the sidebar with pulsing dots; the dashboard opens on live run cards.')}
      ${pat(4, 'KPI tiles that link', 'Four tiles, each one question, each a link to the filtered page, each with a one-line breakdown.')}
      ${pat(5, 'Org chart as a view of people', 'A List/Org toggle on the agents page, not a separate silo.')}
      ${pat(6, 'Detail = conversation + panel', 'Requests for a human decision appear as cards pinned in the thread.')}
      ${pat(7, '⌘K and a ? cheatsheet', 'Search, jump and act from the keyboard; shortcuts are discoverable.')}
      ${pat(8, 'Progressive disclosure of runs', 'A summary, then “worked 5m · called 3 tools”, then the raw log.')}
    </div>
  </section>

  <section class="why-sec"><h2>Where yaaf should beat it</h2>
    <div class="why-grid">
      ${pat('A', 'A ranked “Needs you”, not a count', 'Paperclip’s dashboard shows pending approvals as one tile among four. yaaf’s rule (every row says what happens if you do nothing, ranked by time to consequence) is better and should lead.')}
      ${pat('B', 'Org chart nodes that show work', 'Paperclip’s nodes show identity only. Ours show status, current task, time on it, runs and spend.')}
      ${pat('C', 'A delivery date as a first-class idea', 'Paperclip has no project-level promise. yaaf’s promised vs projected date is the most important number on the Overview.')}
      ${pat('D', 'Stable vocabulary', 'Paperclip churns (task/issue, company/organization, two shells, ~30 flags). We fix one word per concept and keep it.')}
    </div>
  </section>

  <section class="why-sec"><h2>Six principles</h2>
    <ol class="why-princ">
      <li><b>Every screen answers three questions in order:</b> what is happening, does it need me, what do I do about it.</li>
      <li><b>One count for “needs you”, everywhere.</b> The badge, the Overview card and the Inbox read one list.</li>
      <li><b>Plain words in the interface, yaaf’s words one hover away.</b> Dotted underlines explain terms in place; nothing requires the docs.</li>
      <li><b>Agents are people with a current task.</b> Faces, names, status dots and “doing now” lines everywhere a person appears.</li>
      <li><b>Layout carries meaning, not paragraphs.</b> Status is a pill, urgency is a clock, consequence is one labelled line. Help text shrinks from ~24 blocks on the Overview to 2.</li>
      <li><b>The house rules stay visible, not explained.</b> Read-only screens offer the real way forward (“Ask Iris”) in place of the missing button.</li>
    </ol>
  </section>

  <section class="why-sec"><h2>Vocabulary map</h2>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Today</th><th>Proposed</th><th>Why</th></tr></thead>
      <tbody>${vocab.map(([a, b, c]) => `<tr><td class="muted">${a}</td><td><b>${b}</b></td><td class="small ink2">${c}</td></tr>`).join('')}</tbody></table></div>
  </section>

  <section class="why-sec"><h2>What stays exactly as it is</h2>
    <ul class="why-keep">
      <li>The chairman speaks only to the CEO. The org chart offers “Ask Iris about Maya”, never a direct message.</li>
      <li>Only the CEO creates tasks, and only the platform marks a requirement met. The Tasks board is read-only and says so in one line.</li>
      <li>Silence is a decision: every Inbox item states what happens if you do nothing, and approvals still deny themselves.</li>
      <li>Every change to money, dates or scope asks for a reason the CEO reads.</li>
      <li>The design tokens in <span class="mono">web/src/styles.css</span>, including the contrast-checked status colours and team slots.</li>
    </ul>
  </section>

  <section class="why-sec"><h2>Suggested order of work</h2>
    <ol class="why-princ">
      <li><b>Inbox + one needs-you count.</b> Biggest trust win; mostly unifies existing endpoints (<span class="mono">/observe/desk</span>, approvals, asks, flags).</li>
      <li><b>Sidebar IA + project switcher + ⌘K.</b> Pages already exist; this is navigation and naming.</li>
      <li><b>Team page with org chart and agent drawer.</b> Needs a per-agent “current task” field, which the server already has in the board and runs.</li>
      <li><b>New Overview.</b> Fewer sections and fewer pollers; consider one aggregated <span class="mono">/observe/projects/:id/overview</span> endpoint.</li>
      <li><b>Activity timeline</b> replacing the Records pills, then the remaining pages.</li>
    </ol>
    <p class="micro muted" style="margin-top:10px">Per CLAUDE.md, the Inbox is a new concept: check its footprint against the Desk’s (daily brief, agenda, change stamp, MCP reader, CLI) before calling it done.</p>
  </section>`;
}

/* ═════════════ view bindings ═════════════ */
function bindView() {
  const page = $('#page');
  $$('[data-ibtab]', page).forEach((b) => b.addEventListener('click', () => { state.inboxTab = b.dataset.ibtab; state.inboxSel = null; render(); }));
  $$('[data-ibsel]', page).forEach((b) => b.addEventListener('click', () => { state.inboxSel = b.dataset.ibsel; render(); }));
  $$('[data-ibproj]', page).forEach((b) => b.addEventListener('click', () => { state.inboxProject = b.dataset.ibproj; state.inboxSel = null; render(); }));
  $$('[data-teamview]', page).forEach((b) => b.addEventListener('click', () => { state.teamView = b.dataset.teamview; render(); }));
  $$('[data-file]', page).forEach((b) => b.addEventListener('click', () => { state.fileSel = b.dataset.file; render(); }));
  $$('[data-actf]', page).forEach((b) => b.addEventListener('click', () => { state.activityFilter = b.dataset.actf; render(); }));
  $$('[data-settab]', page).forEach((b) => b.addEventListener('click', () => { state.settingsTab = b.dataset.settab; render(); }));
}

/* ═════════════ shortcuts cheatsheet ═════════════ */
function openCheatsheet() {
  const rows = [['⌘ K  or  /', 'Search and jump anywhere'], ['G then I', 'Inbox'], ['G then O', 'Overview'], ['G then C', 'Chat with Iris'], ['G then T', 'Team'], ['J / K', 'Next / previous in the Inbox'], ['A / D', 'Approve / deny the open item'], ['Esc', 'Close a panel'], ['?', 'This list']];
  openDrawer(`<div class="drawer-h"><b class="grow" style="font-size:16px">Keyboard shortcuts</b><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="drawer-b"><dl class="case">${rows.map(([k, v]) => `<div><dt><span class="kbd">${k}</span></dt><dd>${v}</dd></div>`).join('')}</dl></div>`);
}
document.addEventListener('keydown', (e) => {
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName || '');
  if (!typing && e.key === '?') openCheatsheet();
  if (!typing && state.route === 'inbox' && (e.key === 'a' || e.key === 'd') && !e.metaKey && !e.ctrlKey) {
    const it = INBOX.find((x) => x.id === state.inboxSel && !state.done.has(x.id));
    if (it && it.actions) { state.done.add(it.id); const n = inboxList()[0]; state.inboxSel = n ? n.id : null; toast(`${e.key === 'a' ? it.actions[0] : it.actions[1]} — recorded with your name`, true); render(); }
  }
});

</script>
