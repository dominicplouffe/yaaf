<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yaaf Redesign</title>
<meta name="description" content="A clickable redesign of the yaaf chairman's cockpit: one Inbox, a live org chart, and an Overview that answers three questions in five seconds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm three-zone shell — nav rail, one working canvas, a right-hand
   drawer that opens on whatever you clicked. Tokens are yaaf's own, lifted from
   web/src/styles.css unchanged, so this mockup is a re-architecture, not a repaint. */
:root {
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;

  --t-micro: 12px; --t-small: 13px; --t-body: 14px; --t-lead: 15px;
  --t-h3: 16px; --t-h2: 19px; --t-h1: 30px; --t-stat: 26px;

  --radius: 10px; --radius-sm: 7px; --radius-lg: 14px;
  --ease: cubic-bezier(0.2, 0, 0, 1); --fast: 120ms;

  color-scheme: dark;
  --page: #141312; --surface: #1c1b19; --surface-2: #232120; --sunken: #121110;
  --rail: #171615;
  --ink: #f5f3ee; --ink-2: #b5b1a6; --muted: #8c887d;
  --border: #2e2c28; --border-strong: #413e38;
  --accent: #8ca0f0; --accent-rgb: 140, 160, 240; --on-accent: #14161f;
  --accent-2: #c96e48; --accent2-rgb: 201, 110, 72;
  --good: #4fc48c; --good-rgb: 79, 196, 140;
  --warning: #e0ac36; --warning-rgb: 224, 172, 54;
  --serious: #f09055; --serious-rgb: 240, 144, 85;
  --critical: #f0736b; --critical-rgb: 240, 115, 107;
  --hover: rgba(255, 255, 255, 0.035); --hover-strong: rgba(255, 255, 255, 0.065);
  --scrim: rgba(0, 0, 0, 0.6);
  --e1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --e2: 0 2px 4px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
  --e3: 0 18px 48px rgba(0, 0, 0, 0.55);
  --c1: #6884ea; --c2: #c96e48; --c3: #1e96a8; --c4: #a98120; --c5: #a570db;
  --c0: #8c887d;
  --note: #f2c94c; --note-ink: #1a1917;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #faf9f5; --surface: #ffffff; --surface-2: #f7f5ef; --sunken: #f2f0ea;
    --rail: #f4f2ec;
    --ink: #1a1917; --ink-2: #56534b; --muted: #757166;
    --border: #e5e2d9; --border-strong: #d0ccc0;
    --accent: #3355cc; --accent-rgb: 51, 85, 204; --on-accent: #ffffff;
    --accent-2: #c2643e; --accent2-rgb: 194, 100, 62;
    --good: #12704a; --good-rgb: 18, 112, 74;
    --warning: #8a5a00; --warning-rgb: 138, 90, 0;
    --serious: #a64118; --serious-rgb: 166, 65, 24;
    --critical: #b3261e; --critical-rgb: 179, 38, 30;
    --hover: rgba(26, 25, 23, 0.035); --hover-strong: rgba(26, 25, 23, 0.06);
    --scrim: rgba(26, 25, 23, 0.4);
    --e1: 0 1px 2px rgba(26, 25, 23, 0.06), 0 1px 1px rgba(26, 25, 23, 0.04);
    --e2: 0 2px 4px rgba(26, 25, 23, 0.05), 0 8px 20px rgba(26, 25, 23, 0.07);
    --e3: 0 18px 48px rgba(26, 25, 23, 0.16);
    --c1: #3355cc; --c2: #c2643e; --c3: #00a0b0; --c4: #a07a00; --c5: #8e4ec6;
    --c0: #757166;
    --note: #8a5a00; --note-ink: #ffffff;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #faf9f5; --surface: #ffffff; --surface-2: #f7f5ef; --sunken: #f2f0ea;
  --rail: #f4f2ec;
  --ink: #1a1917; --ink-2: #56534b; --muted: #757166;
  --border: #e5e2d9; --border-strong: #d0ccc0;
  --accent: #3355cc; --accent-rgb: 51, 85, 204; --on-accent: #ffffff;
  --accent-2: #c2643e; --accent2-rgb: 194, 100, 62;
  --good: #12704a; --good-rgb: 18, 112, 74;
  --warning: #8a5a00; --warning-rgb: 138, 90, 0;
  --serious: #a64118; --serious-rgb: 166, 65, 24;
  --critical: #b3261e; --critical-rgb: 179, 38, 30;
  --hover: rgba(26, 25, 23, 0.035); --hover-strong: rgba(26, 25, 23, 0.06);
  --scrim: rgba(26, 25, 23, 0.4);
  --e1: 0 1px 2px rgba(26, 25, 23, 0.06), 0 1px 1px rgba(26, 25, 23, 0.04);
  --e2: 0 2px 4px rgba(26, 25, 23, 0.05), 0 8px 20px rgba(26, 25, 23, 0.07);
  --e3: 0 18px 48px rgba(26, 25, 23, 0.16);
  --c1: #3355cc; --c2: #c2643e; --c3: #00a0b0; --c4: #a07a00; --c5: #8e4ec6;
  --c0: #757166;
  --note: #8a5a00; --note-ink: #ffffff;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #141312; --surface: #1c1b19; --surface-2: #232120; --sunken: #121110;
  --rail: #171615;
  --ink: #f5f3ee; --ink-2: #b5b1a6; --muted: #8c887d;
  --border: #2e2c28; --border-strong: #413e38;
  --accent: #8ca0f0; --accent-rgb: 140, 160, 240; --on-accent: #14161f;
  --accent-2: #c96e48; --accent2-rgb: 201, 110, 72;
  --good: #4fc48c; --good-rgb: 79, 196, 140;
  --warning: #e0ac36; --warning-rgb: 224, 172, 54;
  --serious: #f09055; --serious-rgb: 240, 144, 85;
  --critical: #f0736b; --critical-rgb: 240, 115, 107;
  --hover: rgba(255, 255, 255, 0.035); --hover-strong: rgba(255, 255, 255, 0.065);
  --scrim: rgba(0, 0, 0, 0.6);
  --e1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --e2: 0 2px 4px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
  --e3: 0 18px 48px rgba(0, 0, 0, 0.55);
  --c1: #6884ea; --c2: #c96e48; --c3: #1e96a8; --c4: #a98120; --c5: #a570db;
  --c0: #8c887d;
  --note: #f2c94c; --note-ink: #1a1917;
}

/* ───────────────────────── base ───────────────────────── */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: var(--t-body); line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11";
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.good { color: var(--good); } .warn { color: var(--warning); }
.serious { color: var(--serious); } .crit { color: var(--critical); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.lg { width: 18px; height: 18px; }
svg.i.xl { width: 22px; height: 22px; }

/* ───────────────────────── shell ───────────────────────── */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.sidebar {
  background: var(--rail); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.sb-scroll { flex: 1; overflow-y: auto; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.ws {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;
}
.logo {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--ink); color: var(--page); font-weight: 700; font-size: 15px; letter-spacing: -0.04em;
}
.logo b { color: var(--accent-2); font-weight: 700; }
.ws-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.ws-sub { font-size: 12px; color: var(--muted); }
.ws .grow { flex: 1; min-width: 0; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  color: var(--ink-2); flex: none;
}
.icon-btn:hover { background: var(--hover-strong); color: var(--ink); }
.search-btn {
  display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; padding: 7px 10px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); font-size: 13px; width: 100%; text-align: left;
}
.search-btn:hover { border-color: var(--border-strong); color: var(--ink-2); }
.search-btn .grow { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; line-height: 17px; background: var(--surface-2);
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px;
  color: var(--ink-2); font-size: 14px; width: 100%; text-align: left; position: relative;
}
.nav-item:hover { background: var(--hover-strong); color: var(--ink); text-decoration: none; }
.nav-item.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.nav-item.on svg.i { color: var(--accent); }
.nav-item .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge {
  font-size: 11px; font-weight: 600; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px;
  display: grid; place-items: center; background: rgba(var(--warning-rgb), 0.18); color: var(--warning);
}
.nav-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  padding: 16px 10px 6px; display: flex; align-items: center; justify-content: space-between;
}
.proj-switch {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; width: 100%;
  border: 1px solid var(--border); background: var(--surface); text-align: left; margin-bottom: 6px;
}
.proj-switch:hover { border-color: var(--border-strong); }
.proj-mark {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none;
  font-size: 12px; font-weight: 700; color: #fff;
}
.proj-switch .t { font-weight: 600; font-size: 13.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-switch .s { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.proj-switch .grow { flex: 1; min-width: 0; }
.sb-foot { border-top: 1px solid var(--border); padding: 10px; display: flex; align-items: center; gap: 10px; }
.sb-foot .grow { flex: 1; min-width: 0; }
.sb-foot .n { font-size: 13px; font-weight: 600; line-height: 1.2; }
.sb-foot .r { font-size: 12px; color: var(--muted); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px;
  border-bottom: 1px solid var(--border); background: var(--page);
}
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); min-width: 0; flex: 1; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.crumbs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(var(--good-rgb), 0.18); }
.content { flex: 1; overflow-y: auto; min-height: 0; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 32px 64px; }
.page.wide { max-width: none; }
.page.flush { padding: 0; max-width: none; height: 100%; }

/* ───────────────────────── primitives ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
  height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover-strong); color: var(--ink); }
.btn.danger { color: var(--critical); border-color: rgba(var(--critical-rgb), 0.45); }
.btn.danger:hover { background: rgba(var(--critical-rgb), 0.1); }
.btn.good { color: var(--good); border-color: rgba(var(--good-rgb), 0.45); }
.btn.good:hover { background: rgba(var(--good-rgb), 0.1); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; gap: 5px; }
.btn .kbd { margin-left: 2px; }
.btn.primary .kbd { background: transparent; border-color: rgba(0,0,0,0.2); color: inherit; opacity: 0.75; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px;
  font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2);
  color: var(--ink-2); border: 1px solid var(--border);
}
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.s-working { color: var(--accent); background: rgba(var(--accent-rgb), 0.1); border-color: rgba(var(--accent-rgb), 0.28); }
.pill.s-working .d { animation: pulse 1.6s var(--ease) infinite; }
.pill.s-waiting { color: var(--warning); background: rgba(var(--warning-rgb), 0.1); border-color: rgba(var(--warning-rgb), 0.3); }
.pill.s-blocked { color: var(--serious); background: rgba(var(--serious-rgb), 0.1); border-color: rgba(var(--serious-rgb), 0.3); }
.pill.s-good { color: var(--good); background: rgba(var(--good-rgb), 0.1); border-color: rgba(var(--good-rgb), 0.3); }
.pill.s-crit { color: var(--critical); background: rgba(var(--critical-rgb), 0.1); border-color: rgba(var(--critical-rgb), 0.3); }
.pill.s-idle { color: var(--muted); }
.pill.s-idle .d { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.pill.s-paused { color: var(--muted); }
.pill.plain { background: transparent; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); } 60% { box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0); } }
@media (prefers-reduced-motion: reduce) { .pill.s-working .d, .typing i { animation: none !important; } .content { scroll-behavior: auto; } }

.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px;
  font-size: 11.5px; font-weight: 500; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border);
  white-space: nowrap;
}
.tag.id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tag.accent { color: var(--accent); border-color: rgba(var(--accent-rgb), 0.3); background: rgba(var(--accent-rgb), 0.08); }

.av {
  --sz: 28px; width: var(--sz); height: var(--sz); border-radius: 50%; flex: none; position: relative;
  display: grid; place-items: center; font-size: calc(var(--sz) * 0.4); font-weight: 600; color: #fff;
  background: var(--c0); letter-spacing: -0.02em;
}
.av.sq { border-radius: 30%; }
.av.xs { --sz: 20px; } .av.sm { --sz: 24px; } .av.md { --sz: 32px; } .av.lg { --sz: 40px; } .av.xl { --sz: 52px; }
.av.t1 { background: var(--c1); } .av.t2 { background: var(--c2); } .av.t3 { background: var(--c3); }
.av.t4 { background: var(--c4); } .av.t5 { background: var(--c5); }
.av.me { background: var(--ink); color: var(--page); }
.av .st {
  position: absolute; right: -1px; bottom: -1px; width: 34%; height: 34%; min-width: 8px; min-height: 8px;
  border-radius: 50%; border: 2px solid var(--surface); background: var(--muted);
}
.av .st.working { background: var(--accent); } .av .st.waiting { background: var(--warning); }
.av .st.blocked { background: var(--serious); } .av .st.good { background: var(--good); }
.av .st.idle { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--muted); }
.av-stack { display: flex; } .av-stack .av { box-shadow: 0 0 0 2px var(--surface); } .av-stack .av + .av { margin-left: -6px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.card-h h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.card-h .grow { flex: 1; }
.card-h .link { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.card-h .link:hover { color: var(--ink); text-decoration: none; }
.card-b { padding: 14px 18px 18px; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
.bar.good > i { background: var(--good); } .bar.warn > i { background: var(--warning); }
.seg-bar { display: flex; gap: 3px; height: 6px; }
.seg-bar i { flex: 1; border-radius: 2px; background: var(--surface-2); }
.seg-bar i.met { background: var(--good); } .seg-bar i.prog { background: var(--accent); }
.seg-bar i.risk { background: var(--serious); }

.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--e1); }
.seg button .c { font-size: 11.5px; color: var(--muted); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs button { padding: 8px 12px 10px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

.input {
  width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface);
  padding: 0 11px; font-size: 13.5px;
}
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18); }

/* term: plain words first, the yaaf word one hover away */
.term { border-bottom: 1px dashed var(--border-strong); cursor: help; position: relative; }
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
  width: max-content; max-width: 280px; padding: 8px 10px; border-radius: 8px; z-index: 60;
  background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.45; font-weight: 400;
  box-shadow: var(--e2); white-space: normal; text-align: left; pointer-events: none; letter-spacing: 0;
  text-transform: none;
}
[data-tip].tip-down:hover::after { bottom: auto; top: calc(100% + 8px); }
[data-tip].tip-left:hover::after { left: auto; right: 0; transform: none; }

.page-h { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-h .grow { flex: 1; min-width: 260px; }
.page-h h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--t-h1); letter-spacing: -0.01em; line-height: 1.15; }
.page-h .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; max-width: 72ch; }
.page-h .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .big { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 12px; background: var(--surface-2); color: var(--good); }
.empty h4 { color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

.row { display: flex; align-items: center; gap: 10px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }
.wrap { flex-wrap: wrap; }
.divider { height: 1px; background: var(--border); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.small { font-size: 13px; } .micro { font-size: 12px; }
.strong { font-weight: 600; }

/* ───────────────────────── overlays ───────────────────────── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 50; background: var(--surface);
  border-left: 1px solid var(--border); box-shadow: var(--e3); transform: translateX(102%);
  transition: transform 220ms var(--ease); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.on { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.drawer-b { flex: 1; overflow-y: auto; padding: 20px; }

.cmdk-wrap { position: fixed; inset: 0; z-index: 70; display: none; place-items: start center; padding: 12vh 16px 0; background: var(--scrim); }
.cmdk-wrap.on { display: grid; }
.cmdk { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--e3); overflow: hidden; }
.cmdk-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.cmdk-in input { flex: 1; border: 0; background: transparent; font-size: 15px; outline: none; }
.cmdk-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
.cmdk-g { font-size: 11.5px; color: var(--muted); padding: 10px 10px 4px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.cmdk-it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; width: 100%; text-align: left; font-size: 14px; color: var(--ink-2); }
.cmdk-it .grow { flex: 1; min-width: 0; color: var(--ink); }
.cmdk-it.sel, .cmdk-it:hover { background: var(--hover-strong); }
.cmdk-foot { display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%);
  background: var(--ink); color: var(--page); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80;
  box-shadow: var(--e3); display: flex; gap: 10px; align-items: center; transition: transform 220ms var(--ease), opacity 220ms var(--ease), visibility 220ms; max-width: calc(100vw - 32px);
}
.toast:not(.on) { visibility: hidden; opacity: 0; }
.toast.on { transform: translate(-50%, 0); visibility: visible; opacity: 1; }
.toast button { color: var(--page); opacity: 0.7; font-weight: 600; }

/* design notes: numbered callouts that explain each decision */
.dn { display: none; }
body.notes .dn {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--note); color: var(--note-ink); font-size: 11px; font-weight: 700; font-family: var(--font);
  box-shadow: 0 0 0 3px rgba(var(--warning-rgb), 0.25); cursor: help; vertical-align: middle; flex: none;
  margin: 0 4px; position: relative; z-index: 5; line-height: 1;
}
body.notes .dn.abs { position: absolute; top: -9px; right: -9px; margin: 0; }
.notes-toggle.on { background: rgba(var(--warning-rgb), 0.14); color: var(--warning); border-color: rgba(var(--warning-rgb), 0.4); }
.notes-panel {
  display: none; margin-bottom: 22px; border-radius: var(--radius-lg); border: 1px dashed rgba(var(--warning-rgb), 0.55);
  background: rgba(var(--warning-rgb), 0.06); padding: 16px 18px;
}
body.notes .notes-panel { display: block; }
.notes-panel h4 { font-size: 13px; font-weight: 600; color: var(--warning); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.notes-panel ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.notes-panel li { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.notes-panel li .dn { display: inline-grid; margin: 1px 0 0; }
.notes-panel li b { color: var(--ink); font-weight: 600; }

/* ───────────────── shared bits ───────────────── */
.sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); display: inline-block; flex: none; }
.count { font-size: 12px; font-weight: 600; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.count.warn { background: rgba(var(--warning-rgb), 0.16); color: var(--warning); }
.amt { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.amt.lg { font-size: 15px; padding: 2px 8px; vertical-align: middle; }
.kind-ic { --k: var(--ink-2); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--k);
  background: color-mix(in srgb, var(--k) 13%, transparent); }
.chip { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--border-strong); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
.link-btn { color: var(--accent); font-size: inherit; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.legend { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.legend .pill { height: 20px; font-size: 11.5px; }
.team-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.ellipsis-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.relay { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); font-size: 13px; margin-bottom: 18px; flex-wrap: wrap; }
.relay > span { flex: 1; min-width: 200px; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr[data-go], .tbl tbody tr[data-agent] { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl.mini { font-size: 13px; } .tbl.mini td, .tbl.mini th { padding: 7px 10px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.stat-row > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-row b { font-size: 16px; font-weight: 600; }
.stat-row.tight { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.stat-row.tight > div { padding: 8px 10px; }
.kpi-mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.kpi-mini > div { padding: 12px 18px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); min-width: 0; }
.kpi-mini > div:last-child { border-right: 0; }
.kpi-mini b { font-size: 15px; font-weight: 600; }
.kpi-mini.flat { border: 1px solid var(--border); border-radius: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 18px; }
.case { margin: 0; display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.case > div { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 12px 14px; background: var(--surface); }
.case dt { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.case dd { margin: 0; font-size: 14px; line-height: 1.55; }
.case > div.silence { background: color-mix(in srgb, var(--warning) 7%, var(--surface)); }
.case > div.silence dt { color: var(--warning); }

/* ───────────────── sidebar live section ───────────────── */
.live-n { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
.live-n i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
.live-row { padding: 5px 10px; font-size: 13px; }
.live-row .ln { color: var(--ink); font-weight: 500; }
.live-row .ld { color: var(--muted); }
.live-row .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-row .av .st { border-color: var(--rail); }

/* ───────────────── overview ───────────────── */
.ov-head { margin-bottom: 20px; }
.ov-head .eyebrow .sep { margin: 0 2px; }
.ov-title { font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: -0.01em; line-height: 1.1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ov-title .pill { font-family: var(--font); letter-spacing: 0; }
.ov-goal { color: var(--ink-2); font-size: 15px; margin-top: 8px; max-width: 78ch; }
.kpis { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 18px; }
.kpi { text-align: left; padding: 16px 18px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: background var(--fast); }
.kpi:first-of-type { border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
.kpi:last-child { border-right: 0; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
.kpi:hover { background: var(--hover); }
.kpi-l { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi-v { font-size: var(--t-stat); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.kpi-v .of { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kpi-s { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; min-height: 2.8em; }
.kpi-s b { color: var(--ink); font-weight: 600; }
.kpi .bar, .kpi .seg-bar { margin-top: auto; }
.kpi .spark { margin-top: auto; width: 100%; height: 26px; }
.bar-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.bar-proj { position: absolute; top: -3px; bottom: -3px; width: 2px; background: repeating-linear-gradient(var(--ink-2) 0 2px, transparent 2px 4px); }
.bar { overflow: visible; }
.bar > i { overflow: hidden; }
.bar.lg { height: 10px; border-radius: 5px; margin-top: 14px; }
.bar.lg > i { border-radius: 5px; }
.tl { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: auto; }
.tl-done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px 0 0 3px; background: var(--border-strong); }
.tl-today, .tl-prom, .tl-proj { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 1px; }
.tl-today { background: var(--ink); } .tl-prom { background: var(--ink-2); }
.tl-proj { background: repeating-linear-gradient(var(--serious) 0 3px, transparent 3px 5px); }
.tl-k { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 0 0 56%; gap: 6px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.needs { padding-top: 6px; padding-bottom: 8px; }
.need { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.need:first-child { border-top: 0; }
.need-t { font-weight: 500; font-size: 14px; }
.need-t a { color: var(--ink); }
.need-m { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 3px; flex-wrap: wrap; }
.need-m span { display: inline-flex; align-items: center; gap: 4px; }
.need-a { display: flex; gap: 6px; flex: none; }
.people { padding-top: 6px; padding-bottom: 6px; }
.person { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 10px; }
.person:hover { background: var(--hover-strong); }
.person b { font-weight: 600; font-size: 14px; }
.doing { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.p-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.rm-mini { display: flex; flex-direction: column; }
.rm-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.rm-row:first-child { border-top: 0; }
.ceo-card .card-b { padding-top: 12px; }
.ceo-msg { font-size: 14px; line-height: 1.6; color: var(--ink); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.agenda { display: flex; flex-direction: column; padding-top: 8px; }
.ag { display: grid; grid-template-columns: 74px 14px 1fr; gap: 8px; align-items: start; padding: 7px 0; font-size: 13px; position: relative; }
.ag-d { display: flex; flex-direction: column; line-height: 1.25; }
.ag-d b { font-weight: 600; font-size: 12.5px; }
.ag-d span { font-size: 11.5px; color: var(--muted); }
.ag-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--muted); }
.ag-you .ag-dot { background: var(--warning); }
.ag-auto .ag-dot { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-2); }
.ag-meet .ag-dot { background: var(--accent); }
.ag-due .ag-dot { background: var(--ink); }
.ag-proj .ag-dot { background: transparent; box-shadow: inset 0 0 0 2px var(--serious); }
.ag-proj .grow { color: var(--serious); }
.ag-key { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
.ag-key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: -0.5px; }
.ag-key .k-you::before { background: var(--warning); } .ag-key .k-auto::before { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.ag-key .k-meet::before { background: var(--accent); } .ag-key .k-due::before { background: var(--ink); }
.hbars { display: flex; flex-direction: column; gap: 9px; padding-top: 12px; }
.hb { display: grid; grid-template-columns: 74px 1fr 62px; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { color: var(--ink-2); }
.hb-t { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.hb-t i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.hb-v { text-align: right; font-size: 12.5px; }
.files-mini { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
.fm { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -8px; border-radius: 9px; color: var(--ink); font-size: 13.5px; }
.fm:hover { background: var(--hover-strong); text-decoration: none; }
.f-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.health { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-top: 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 13.5px; flex-wrap: wrap; }
.h-ok { color: var(--good); display: grid; }

/* ───────────────── inbox ───────────────── */
.inbox { display: grid; grid-template-columns: 420px minmax(0, 1fr); height: 100%; min-height: 0; }
.ib-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--page); }
.ib-head { padding: 22px 18px 10px; border-bottom: 1px solid var(--border); }
.ib-h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
.ib-tabs { margin-top: 14px; width: 100%; }
.ib-tabs button { flex: 1; justify-content: center; padding: 0 6px; }
.ib-proj { margin-top: 10px; }
.ib-proj .chip { height: 24px; font-size: 12px; padding: 0 9px; }
.ib-hint { margin-top: 10px; }
.ib-rows { flex: 1; overflow-y: auto; padding: 6px; }
.ib-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 10px; width: 100%; text-align: left; position: relative; }
.ib-row:hover { background: var(--hover-strong); }
.ib-row.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); }
.ib-row.unread::before { content: ""; position: absolute; left: 3px; top: 24px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ib-r-k { font-size: 12px; font-weight: 600; }
.ib-r-t { display: block; font-size: 14px; font-weight: 500; margin-top: 2px; line-height: 1.4; }
.ib-r-s { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.ib-row.watch { cursor: default; }
.ib-foot { border-top: 1px solid var(--border); padding: 9px 14px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.ib-detail { overflow-y: auto; padding: 28px 40px 48px; min-width: 0; }
.ib-detail-in { max-width: 760px; }
.ib-title { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25; }
.ib-sum { font-size: 15px; color: var(--ink-2); margin-bottom: 18px; max-width: 70ch; }
.clock { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
.clock.warn { color: var(--warning); background: rgba(var(--warning-rgb), 0.1); border-color: rgba(var(--warning-rgb), 0.3); }
.ib-ctx { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
.ib-ctx .tag { height: 26px; font-size: 12.5px; cursor: pointer; }

/* ───────────────── home ───────────────── */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pcard { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color var(--fast); }
.pcard:hover { border-color: var(--border-strong); }
.pc-goal { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.pc-stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pc-stats b { color: var(--ink); font-weight: 600; }
.pc-stats .warn b { color: var(--warning); }
.brief p { font-size: 13.5px; line-height: 1.55; }
.brief ul { margin: 10px 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.brief ul b { color: var(--ink); font-weight: 600; }
.checklist { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
.ck { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -8px; border-radius: 8px; font-size: 13.5px; text-align: left; width: calc(100% + 16px); color: var(--ink); }
.ck.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.ck.done svg { color: var(--good); }
button.ck:hover { background: var(--hover-strong); }
button.ck svg:first-child { color: var(--muted); }

/* ───────────────── team / org chart ───────────────── */
.org-scroll { overflow-x: auto; padding-bottom: 12px; }
.org { min-width: 1080px; display: flex; flex-direction: column; align-items: center; padding: 8px 4px 0; }
.org-level { display: flex; justify-content: center; }
.org-v { width: 2px; height: 26px; background: var(--border-strong); }
.org-branches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; width: 100%; position: relative; padding-top: 26px; }
.org-branches::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: var(--border-strong); }
.org-branch { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.org-branch::before { content: ""; position: absolute; top: -26px; left: 50%; width: 2px; height: 26px; background: var(--border-strong); }
.team-h { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 14px; }
.team-role { display: flex; gap: 6px; min-height: 22px; align-items: center; flex-wrap: nowrap; overflow: hidden; margin-top: -2px; }
.team-members { display: flex; flex-direction: column; gap: 8px; }
.onode { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color var(--fast), box-shadow var(--fast); }
button.onode:hover { border-color: var(--border-strong); box-shadow: var(--e2); }
.onode.ceo, .onode.me-node { width: 300px; }
.onode.st-working { border-color: rgba(var(--accent-rgb), 0.35); }
.onode.st-waiting { border-color: rgba(var(--warning-rgb), 0.45); }
.on-n { display: block; font-size: 15px; font-weight: 600; }
.on-r { display: block; font-size: 12.5px; color: var(--muted); }
.on-s { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.on-d { font-size: 13px; color: var(--ink-2); line-height: 1.45; min-height: 2.9em; }
.on-f { display: flex; gap: 10px; border-top: 1px solid var(--border); padding-top: 9px; flex-wrap: wrap; }
.on-x { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.onode.add { align-items: center; justify-content: center; text-align: center; border-style: dashed; color: var(--muted); min-height: 160px; gap: 6px; background: transparent; }
.onode.add:hover { color: var(--ink); }

/* agent drawer */
.cur-task { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 44px 14px 1fr; gap: 10px; font-size: 13.5px; padding: 6px 0; position: relative; }
.steps li::after { content: ""; position: absolute; left: 60px; top: 22px; bottom: -6px; width: 2px; background: var(--border); }
.steps li:last-child::after { display: none; }
.s-t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.steps li > i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--border-strong); position: relative; z-index: 1; }
.steps .k-live > i { background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
.steps .k-live .s-x { color: var(--accent); }
.steps .k-think .s-x { color: var(--ink-2); font-style: italic; }
.typing { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: 0.2s; } .typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.tlist-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.drawer-f { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ───────────────── chat ───────────────── */
.chat { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; min-height: 0; }
.chat-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.chat-h { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.chat-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.chat-scroll > * { max-width: 820px; width: 100%; margin-left: auto; margin-right: auto; }
.day-sep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.mine { justify-content: flex-end; }
.bubble-wrap { max-width: min(600px, 86%); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.mine .bubble-wrap { align-items: flex-end; }
.m-meta { font-size: 12px; color: var(--muted); font-weight: 500; }
.m-meta span { font-weight: 400; margin-left: 6px; }
.bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 11px 14px; font-size: 14.5px; line-height: 1.55; }
.msg.mine .bubble { background: var(--accent); color: var(--on-accent); border-color: var(--accent); border-radius: 14px 4px 14px 14px; }
.mcard { background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.mcard b { font-weight: 600; }
.mcard .micro.muted { font-weight: 400; }
.mcard > .row > div > span.micro { display: block; }
.mcard.done { color: var(--good); display: flex; gap: 8px; align-items: center; }
.typing-line { display: flex; align-items: center; gap: 6px; }
.composer { border-top: 1px solid var(--border); padding: 12px 24px 16px; }
.composer > * { max-width: 820px; margin-left: auto; margin-right: auto; }
.composer .quick { margin: 0 auto 10px; }
.composer .chip { height: 26px; font-size: 12.5px; }
.comp-box { display: flex; gap: 8px; align-items: flex-end; }
.comp-box textarea { flex: 1; }
.chat-side { border-left: 1px solid var(--border); padding: 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; background: var(--rail); }
.side-sec { display: flex; flex-direction: column; gap: 8px; }
.side-item { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px; margin: 0 -8px; border-radius: 9px; font-size: 13px; }
.side-item:not(.static):hover { background: var(--hover-strong); }
.side-item.static { background: var(--surface); margin: 0; border: 1px solid var(--border); }

/* ───────────────── roadmap ───────────────── */
.banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid; flex-wrap: wrap; position: relative; }
.banner > .grow { min-width: 260px; }
.banner.risk { border-color: rgba(var(--serious-rgb), 0.4); background: rgba(var(--serious-rgb), 0.07); }
.b-ic { color: var(--serious); display: grid; }
.burn { width: 100%; min-width: 600px; height: auto; display: block; }
.legend .lg-i { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); margin-left: 10px; }
.lg-i i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.lg-i i.dash { height: 0; border-top: 2px dashed; }
.stage { margin-top: 22px; }
.stage-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stage-h h3 { font-size: 15px; font-weight: 600; }
.req { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--border); }
.req:first-child { border-top: 0; }
.req-t { font-size: 14px; line-height: 1.5; }
.req-m { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }

/* ───────────────── tasks ───────────────── */
.board { display: grid; grid-template-columns: repeat(5, minmax(196px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.bcol { background: var(--sunken); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
.bcol-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 4px; }
.tcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.tc-t { font-size: 13.5px; font-weight: 500; line-height: 1.4; }
.tc-f { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
.tc-f .micro { display: inline-flex; align-items: center; gap: 3px; }

/* ───────────────── deliverables ───────────────── */
.files { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: 100%; min-height: 0; }
.f-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.f-head { padding: 22px 16px 12px; border-bottom: 1px solid var(--border); }
.f-rows { overflow-y: auto; padding: 6px; flex: 1; }
.f-day { font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 10px 6px; }
.f-row { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; width: 100%; text-align: left; font-size: 13.5px; }
.f-row:hover { background: var(--hover-strong); }
.f-row.on { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); }
.f-reader { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.f-rhead { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.doc { overflow-y: auto; padding: 28px 40px 60px; max-width: 820px; width: 100%; }
.doc h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 8px 0 14px; }
.doc h3 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; }
.doc p { font-size: 15px; line-height: 1.7; color: var(--ink); max-width: 68ch; }
.proof { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--good); background: rgba(var(--good-rgb), 0.1); padding: 0 6px; border-radius: 5px; vertical-align: 1px; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin-top: 12px; font-size: 14px; }
.callout svg { margin-top: 3px; color: var(--accent); }

/* ───────────────── spend ───────────────── */
.spend-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; align-items: stretch; }
.budget { position: relative; }
.big-num { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin-top: 10px; }
.big-num .of { font-size: 16px; color: var(--muted); font-weight: 500; }
.policy { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; padding: 12px; background: var(--surface-2); border-radius: 10px; font-size: 13px; color: var(--ink-2); }
.policy > div { display: flex; gap: 8px; align-items: center; }
.policy b { color: var(--ink); }

/* ───────────────── reviews ───────────────── */
.rv-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
.decision { display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: rgba(var(--good-rgb), 0.08); border: 1px solid rgba(var(--good-rgb), 0.25); font-size: 13.5px; }
.decision svg { color: var(--good); margin-top: 3px; }
.levers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lever { text-align: left; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); font-size: 14px; }
.lever:hover { border-color: var(--border-strong); background: var(--surface-2); }

/* ───────────────── activity ───────────────── */
.feed { display: flex; flex-direction: column; }
.feed-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13.5px; cursor: pointer; }
.feed-row:first-child { border-top: 0; }
.feed-row:hover { background: var(--hover); }
.feed-t { width: 42px; color: var(--muted); font-size: 11.5px; flex: none; }
.feed-ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.feed-ic.k-fail { color: var(--serious); background: rgba(var(--serious-rgb), 0.12); }
.feed-ic.k-proof, .feed-ic.k-publish { color: var(--good); background: rgba(var(--good-rgb), 0.12); }
.feed-ic.k-flag { color: var(--serious); }
.feed-ic.k-decision { color: var(--accent); background: rgba(var(--accent-rgb), 0.12); }
.feed-ic.k-ask { color: var(--warning); background: rgba(var(--warning-rgb), 0.12); }

/* ───────────────── settings ───────────────── */
.settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; }
.set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start; }
.set-nav button { display: flex; flex-direction: column; text-align: left; padding: 8px 12px; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.set-nav button:hover { background: var(--hover-strong); }
.set-nav button.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.set-h { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.picks.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.picks.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pick { text-align: left; border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.pick:hover { border-color: var(--border-strong); }
.pick.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15); }
.pick ul { margin: 8px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.pick ul:empty { display: none; }
.role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.role { padding: 14px; }

/* ───────────────── why ───────────────── */
.why-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
.why-stats > div { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.why-stats > div > b { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1; color: var(--accent-2); }
.why-stats span { font-size: 13px; color: var(--ink-2); }
.why-stats span b { color: var(--ink); font-weight: 600; }
.why-sec { margin-bottom: 32px; }
.why-sec h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin-bottom: 12px; }
.why-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.why-pat { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.why-pat b { font-size: 14px; font-weight: 600; }
.why-pat p { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
.why-n { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.why-princ { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; max-width: 80ch; color: var(--ink-2); }
.why-princ b { color: var(--ink); font-weight: 600; }
.why-keep { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink-2); max-width: 80ch; }

/* ───────────────── responsive ───────────────── */
.menu-btn { display: none; }
@media (max-width: 1180px) {
  .ov-grid, .home-grid { grid-template-columns: minmax(0, 1fr); }
  .spend-top { grid-template-columns: minmax(0, 1fr); }
  .chat { grid-template-columns: minmax(0, 1fr); }
  .chat-side { display: none; }
}
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; z-index: 45; transform: translateX(-102%); transition: transform 200ms var(--ease); box-shadow: var(--e3); padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .sidebar { transform: none; }
  .menu-btn { display: grid; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd) { border-right: 1px solid var(--border); }
  .kpi { border-bottom: 1px solid var(--border); border-radius: 0 !important; }
  .inbox, .files { grid-template-columns: minmax(0, 1fr); height: auto; }
  .ib-list, .f-list { border-right: 0; border-bottom: 1px solid var(--border); }
  .ib-rows { max-height: 46vh; }
  .ib-detail { padding: 22px 16px 40px; }
  .doc { padding: 22px 16px 40px; }
  .why-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .settings { grid-template-columns: minmax(0, 1fr); }
  .set-nav { flex-direction: row; overflow-x: auto; position: static; }
  .set-nav button .micro { display: none; }
  .rv-cols { grid-template-columns: minmax(0, 1fr); }
  .kpi-mini.flat { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .page { padding: 20px 16px 48px; }
  .topbar { padding: 0 12px; }
  .live, .topbar .hide-sm { display: none; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi { border-right: 0 !important; }
  .pgrid, .why-grid, .why-stats, .picks, .picks.three, .picks.four, .levers { grid-template-columns: minmax(0, 1fr); }
  .need { flex-wrap: wrap; }
  .need-a { width: 100%; padding-left: 42px; }
  .person .p-right .micro { display: none; }
  .kpi-mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-mini > div:nth-child(2) { border-right: 0; }
  .kpi-mini.flat { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .case > div { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-title { font-size: 28px; }
  .req { flex-wrap: wrap; }
  .chat-h, .chat-scroll, .composer { padding-left: 16px; padding-right: 16px; }
  .ib-tabs button { font-size: 12px; }
  .onode.ceo, .onode.me-node { width: 100%; max-width: 300px; }
}
.tl { margin-bottom: 18px; }
.tl-slip { position: absolute; top: 0; bottom: 0; background: rgba(var(--serious-rgb), 0.55); border-radius: 0 3px 3px 0; }
.tl-lab { position: absolute; top: 12px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.tl-lab.end { transform: translateX(-100%); }
.tl-lab.slip { transform: none; color: var(--serious); font-weight: 600; margin-left: 4px; }
.more-row { display: flex; align-items: center; gap: 6px; padding: 12px 0 2px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.more-row:hover { color: var(--ink); text-decoration: none; }
@media (hover: none) { .ib-foot { display: none; } }

#sb { display: flex; flex-direction: column; gap: 2px; }
.wordmark { font-family: var(--font-display); font-size: 26px; line-height: 1; letter-spacing: -0.01em; color: var(--ink); }
.wordmark b { font-weight: 400; color: var(--accent); }

function bindPage() {
  const pg = $('#page');
  $$('[data-go]', pg).forEach((el) => el.addEventListener('click', (e) => {
    e.preventDefault();
    const extra = {};
    if (el.dataset.sel) extra.inboxSel = el.dataset.sel;
    if (el.dataset.tab) extra.inboxTab = el.dataset.tab;
    go(el.dataset.go, extra);
  }));
  $$('[data-agent]', pg).forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openAgent(el.dataset.agent); }));
  $$('[data-toast]', pg).forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toast(el.dataset.toast); }));
  $$('[data-resolve]', pg).forEach((el) => el.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = el.dataset.resolve;
    state.done.add(id);
    const next = INBOX.find((i) => !state.done.has(i.id));
    if (state.inboxSel === id && next) state.inboxSel = next.id;
    toast(el.dataset.msg || 'Done', true);
    render();
  }));
  if (typeof bindView === 'function') bindView();
}

/* ───────────── drawer ───────────── */
function openDrawer(html) {
  $('#drawer').innerHTML = html;
  $('#drawer').classList.add('on');
  $('#scrim').classList.add('on');
  $$('#drawer [data-close]').forEach((b) => b.addEventListener('click', closeDrawer));
  $$('#drawer [data-toast]').forEach((el) => el.addEventListener('click', () => toast(el.dataset.toast)));
  $$('#drawer [data-agent]').forEach((el) => el.addEventListener('click', () => openAgent(el.dataset.agent)));
  $$('#drawer [data-go]').forEach((el) => el.addEventListener('click', (e) => { e.preventDefault(); go(el.dataset.go); }));
  $$('#drawer [data-dtab]').forEach((b) => b.addEventListener('click', () => {
    $$('#drawer [data-dtab]').forEach((x) => x.classList.toggle('on', x === b));
    $$('#drawer [data-dpane]').forEach((p) => (p.hidden = p.dataset.dpane !== b.dataset.dtab));
  }));
}
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ───────────── toast ───────────── */
let toastTimer;
function toast(msg, undo = false) {
  const t = $('#toast');
  t.innerHTML = `${ic('check', 'sm')}<span>${msg}</span>${undo ? '<button id="undo">Undo</button>' : ''}`;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
  const u = $('#undo');
  if (u) u.addEventListener('click', () => { state.done.clear(); render(); t.classList.remove('on'); });
}

let cmdSel = 0;
function openCmd() {
  $('#cmdk-wrap').classList.add('on');
  const inp = $('#cmdk-q');
  inp.value = '';
  cmdSel = 0;
  drawCmd();
  setTimeout(() => inp.focus(), 10);
}
function closeCmd() { $('#cmdk-wrap').classList.remove('on'); }
function cmdMatches() {
  const q = $('#cmdk-q').value.trim().toLowerCase();
  return CMDS().filter((c) => !q || c.label.toLowerCase().includes(q) || c.g.toLowerCase().includes(q));
}
function drawCmd() {
  const list = cmdMatches();
  let g = '';
  let html = '';
  list.forEach((c, i) => {
    if (c.g !== g) { g = c.g; html += `<div class="cmdk-g">${g}</div>`; }
    const lead = c.avatar ? av(c.avatar, 'xs') : c.mark ? `<span class="proj-mark" style="width:20px;height:20px;font-size:9px;border-radius:5px;background:var(--c${c.mark.slot})">${c.mark.mark}</span>` : ic(c.icon);
    html += `<button class="cmdk-it ${i === cmdSel ? 'sel' : ''}" data-i="${i}">${lead}<span class="grow">${c.label}</span>${c.hint ? `<span class="micro muted">${c.hint}</span>` : ''}</button>`;
  });
  $('#cmdk-list').innerHTML = html || `<div class="empty small">Nothing matches. Try “inbox”, “Maya” or “pause”.</div>`;
  $$('#cmdk-list .cmdk-it').forEach((b) => b.addEventListener('click', () => { closeCmd(); list[+b.dataset.i].run(); }));
}

/* ───────────── theme + notes ───────────── */
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('yaaf-mock-theme', next); } catch (e) { /* storage may be blocked */ }
  paintThemeBtn();
}
function paintThemeBtn() { $('#theme-btn').innerHTML = ic(currentTheme() === 'dark' ? 'sun' : 'moon'); }
function toggleNotes() {
  document.body.classList.toggle('notes');
  $('#notes-btn').classList.toggle('on', document.body.classList.contains('notes'));
  try { localStorage.setItem('yaaf-mock-notes', document.body.classList.contains('notes') ? '1' : '0'); } catch (e) { /* ignore */ }
}

/* ───────────── keyboard ───────────── */
let gPending = false;
document.addEventListener('keydown', (e) => {
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if ($('#cmdk-wrap').classList.contains('on')) {
    const list = cmdMatches();
    if (e.key === 'Escape') closeCmd();
    else if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, list.length - 1); drawCmd(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); drawCmd(); }
    else if (e.key === 'Enter' && list[cmdSel]) { e.preventDefault(); closeCmd(); list[cmdSel].run(); }
    return;
  }
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); openCmd(); return; }
  if (gPending) {
    gPending = false;
    const map = { i: 'inbox', o: 'overview', c: 'chat', t: 'team', r: 'roadmap', h: 'home', a: 'activity', d: 'files', s: 'spend' };
    if (map[e.key]) { go(map[e.key]); return; }
  }
  if (e.key === 'g') { gPending = true; setTimeout(() => (gPending = false), 900); return; }
  if (state.route === 'inbox' && (e.key === 'j' || e.key === 'k')) {
    const list = inboxList();
    const i = list.findIndex((x) => x.id === state.inboxSel);
    const n = list[Math.max(0, Math.min(list.length - 1, i + (e.key === 'j' ? 1 : -1)))];
    if (n) { state.inboxSel = n.id; render(); }
  }
});

/* ───────────── boot ───────────── */
function boot() {
  try {
    const t = localStorage.getItem('yaaf-mock-theme');
    if (t) document.documentElement.dataset.theme = t;
    if (localStorage.getItem('yaaf-mock-notes') === '1') document.body.classList.add('notes');
  } catch (e) { /* storage may be blocked */ }
  $('#notes-btn').classList.toggle('on', document.body.classList.contains('notes'));
  paintThemeBtn();
  $('#theme-btn').addEventListener('click', toggleTheme);
  $('#notes-btn').addEventListener('click', toggleNotes);
  $('#search-btn').addEventListener('click', openCmd);
  $('#scrim').addEventListener('click', closeDrawer);
  $('#cmdk-wrap').addEventListener('click', (e) => { if (e.target.id === 'cmdk-wrap') closeCmd(); });
  $('#cmdk-q').addEventListener('input', () => { cmdSel = 0; drawCmd(); });
  $('#menu-btn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#sb').addEventListener('click', (e) => {
    if (e.target.closest('[data-cmd]')) { openCmd(); $('#cmdk-q').value = 'Projects'; drawCmd(); return; }
    const ag = e.target.closest('[data-agent-sb]');
    if (ag) { openAgent(ag.dataset.agentSb); document.body.classList.remove('nav-open'); return; }
    const a = e.target.closest('[data-go]');
    if (a) { e.preventDefault(); document.body.classList.remove('nav-open'); go(a.dataset.go); }
  });
  $('#help-btn').addEventListener('click', openCheatsheet);
  window.addEventListener('hashchange', () => {
    const r = (location.hash || '').replace('#', '');
    if (ROUTES[r] && r !== state.route) go(r);
  });
  const h = (location.hash || '').replace('#', '');
  go(ROUTES[h] ? h : 'overview');
}
document.addEventListener('DOMContentLoaded', boot);

function sparkline(vals, w = 120, h = 30, cls = '') {
  const max = Math.max(...vals, 1);
  const step = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * step, h - 3 - (v / max) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="rgba(var(--accent-rgb),0.14)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

function projectCard(p) {
  const tone = p.health === 'risk' ? 'serious' : p.health === 'good' ? 'good' : 'muted';
  const pct = Math.round((p.spent / p.cap) * 100);
  return `<button class="pcard" data-go="overview">
    <div class="row gap10" style="gap:10px"><span class="proj-mark" style="background:var(--c${p.slot})">${p.mark}</span>
      <span class="grow"><b class="ellipsis" style="display:block">${p.name}</b><span class="micro muted">${p.shape} · ${p.due}</span></span>
      ${p.status === 'paused' ? pill('paused', 'Paused') : `<span class="pill ${tone === 'serious' ? 's-blocked' : 's-good'}"><i class="d"></i>${p.healthLabel}</span>`}</div>
    <p class="pc-goal">${p.goal}</p>
    <div class="pc-stats">
      <span><b class="num">${p.working}</b>/${p.people} working</span>
      <span><b class="num">$${Math.round(p.spent)}</b> of $${p.cap}</span>
      ${p.needs ? `<span class="warn"><b>${p.needs}</b> need you</span>` : '<span class="muted">Nothing needs you</span>'}
    </div>
    <div class="bar ${pct >= 100 ? 'warn' : ''}"><i style="width:${Math.min(pct, 100)}%"></i></div>
    ${p.status === 'paused' ? '<p class="micro muted" style="margin-top:8px">Paused itself at the $200 cap on 9 Oct. Raise the cap or wait for 1 Nov.</p>' : ''}
  </button>`;
}

function burnup() {
  /* x: Oct 1 .. Nov 5 (36 days); y: requirements 0..6 */
  const W = 1080, H = 250, L = 34, R = 16, T = 22, B = 30;
  const x = (d) => L + (d / 35) * (W - L - R);
  const y = (v) => T + (1 - v / 6) * (H - T - B);
  const actual = [[0, 0], [5, 0], [5, 1], [8, 1], [8, 2], [11, 2]];
  const dA = actual.map((p, i) => (i ? 'L' : 'M') + x(p[0]) + ' ' + y(p[1])).join(' ');
  const ticks = [[0, '1 Oct'], [7, '8'], [14, '15'], [21, '22'], [29, '30 Oct'], [33, '3 Nov']];
  return `<svg viewBox="0 0 ${W} ${H}" class="burn" role="img" aria-label="Burn-up: 2 of 6 requirements met by 12 Oct, projected to finish 3 Nov against a promise of 30 Oct">
    ${[0, 2, 4, 6].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    ${ticks.map(([d, l]) => `<text x="${x(d)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`).join('')}
    <line x1="${x(29)}" x2="${x(29)}" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1.5"/>
    <text x="${x(29) - 6}" y="${T + 10}" text-anchor="end" font-size="11" fill="var(--ink-2)">Promised</text>
    <line x1="${x(33)}" x2="${x(33)}" y1="${T}" y2="${H - B}" stroke="var(--serious)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${x(33) - 6}" y="${T + 24}" text-anchor="end" font-size="11" fill="var(--serious)">Projected</text>
    <line x1="${x(11)}" x2="${x(11)}" y1="${T}" y2="${H - B}" stroke="var(--border-strong)" stroke-width="1"/>
    <text x="${x(11) + 6}" y="${H - B - 6}" font-size="11" fill="var(--muted)">Today</text>
    <path d="M${x(11)} ${y(2)} L ${x(33)} ${y(6)}" stroke="var(--serious)" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
    <path d="${dA} L ${x(11)} ${y(0)} L ${x(0)} ${y(0)} Z" fill="rgba(var(--accent-rgb),0.12)"/>
    <path d="${dA}" stroke="var(--accent)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <circle cx="${x(11)}" cy="${y(2)}" r="4" fill="var(--accent)"/>
    <line x1="${L}" x2="${W - R}" y1="${y(6)}" y2="${y(6)}" stroke="var(--muted)" stroke-dasharray="2 4"/>
    <text x="${W - R}" y="${y(6) - 6}" text-anchor="end" font-size="11" fill="var(--muted)">Scope · 6</text>
  </svg>`;
}
