[project]
name = "yaaf"
version = "0.1.0"
description = "Yet Another Agent Framework — a hardened multi-agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    # Drives the Claude Code CLI: inside a sandbox for a project's agents, and
    # in-process for the Founder. One transport, so one credential story — a
    # subscription token is a CLI credential and not a Messages API one.
    "claude-agent-sdk>=0.1.0",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # The suite is CPU-bound — it is the app's own Python doing the work, not
    # the database waiting — so it parallelises almost linearly across cores.
    # `-n auto` is how CI runs it and how you should run it locally.
    "pytest-xdist>=3.6",
    # Change-scoped selection for the inner loop: reruns only the tests whose
    # covered code moved. Never a gate — CI always runs everything.
    "pytest-testmon>=2.1",
    # Shards the suite across CI jobs, so CI wall clock is a function of shard
    # count rather than test count.
    "pytest-split>=0.9",
    "ruff>=0.5",
]
# S3-compatible artifact store backend (MinIO, R2, AWS). The base install
# stays boto3-free: yaaf.core.artifacts imports it lazily, only when
# YAAF_ARTIFACT_S3_ENDPOINT is set.
s3 = [
    "boto3>=1.34",
]

[project.scripts]
yaaf = "yaaf.cli.main:app"
yaaf-server = "yaaf.server.main:main"
yaaf-runner = "yaaf.runner.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yaaf*"]

# The goal grammar is read at runtime by the Founder's prompt and by the
# goal grader, so it has to be in the wheel — not just in the checkout.
[tool.setuptools.package-data]
"yaaf.founder" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in parameter defaults is the framework idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
