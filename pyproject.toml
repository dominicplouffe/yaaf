[project]
name = "yaaf"
version = "0.1.0"
description = "Yet Another Agent Framework — a hardened multi-agent company platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    "claude-agent-sdk>=0.1.0",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
yaaf = "yaaf.cli.main:app"
yaaf-server = "yaaf.server.main:main"
yaaf-runner = "yaaf.runner.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yaaf*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in parameter defaults is the framework idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
