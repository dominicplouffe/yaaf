name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same PR makes the first one's answer worthless. Cancel
# it rather than paying a runner to finish computing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of the repo did this change actually touch? A README typo has
  # no business spending ten minutes in Postgres, and a CSS tweak has none
  # spending it in pytest. Computed with git rather than a marketplace action
  # so the gate has no supply chain of its own.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # fetch-depth: 0 above already has every branch, so the merge
            # base is local. Diff from it, not from the base tip, or every
            # commit landing on main shows up as "changed by this PR".
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            changed="$(git diff --name-only "$base" HEAD)"
          elif git rev-parse --quiet --verify "${{ github.event.before }}^{commit}" >/dev/null; then
            changed="$(git diff --name-only "${{ github.event.before }}" HEAD)"
          else
            # First push to a new branch, or a force-push past what we have:
            # nothing to diff against, so run everything.
            changed=""
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # No diff (or a workflow edit) means run everything — the safe
          # direction is always "test more than you needed to".
          run_all=no
          if [ -z "$changed" ] || echo "$changed" | grep -qE '^\.github/workflows/'; then
            run_all=yes
          fi

          match() {
            if [ "$run_all" = "yes" ]; then echo true; return; fi
            if echo "$changed" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "python=$(match '^(yaaf|tests|migrations|evals|roles|crews)/|^(pyproject\.toml|alembic\.ini)$')"
            echo "web=$(match '^web/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # The sandbox runs its files on its base image's python3, not on the 3.12 the
  # suite runs on. Import each one there, in that base — read off the
  # Dockerfile, so a base bump moves this check with it. The image build runs
  # the same check, so a deploy cannot ship what this would have caught.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          base="$(grep -m1 -oP '^FROM \K\S+' deploy/sandbox/Dockerfile)"
          docker run --rm -v "$PWD":/src:ro "$base" bash -euc '
            apt-get update -qq && apt-get install -y -qq python3 python3-venv >/dev/null
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q claude-agent-sdk "anthropic>=1.13,<2" httpx "mcp<2"
            /tmp/venv/bin/python /src/deploy/sandbox/check_entries.py --dockerfile /src'

  # Postgres only. SQLite is what a contributor's checkout runs and what the
  # fire drill runs, but it cannot exercise the things a deployment depends on
  # — FOR UPDATE SKIP LOCKED, JSONB, LISTEN/NOTIFY, TIMESTAMPTZ, or the ALTER
  # TABLE half of the migration chain — so a suite green on SQLite alone would
  # be green about a database nobody deploys.
  #
  # Sharded, so that CI wall clock is a function of how many shards we run and
  # not of how many tests exist. When the suite outgrows two minutes again, add
  # shards here rather than waiting longer — that is the whole point of the
  # shape. Each shard is a job of its own, so each gets its own Postgres rather
  # than four xdist workers contending for one, which is where the remaining
  # time on a single box goes.
  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The data directory on tmpfs. A test database that does not survive
        # the runner is not a problem — it does not survive the job either —
        # and fsync against the runner's disk was costing about a third of the
        # suite's wall clock.
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YAAF_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # -n auto parallelises within the shard; --splits/--group divides the
      # suite across them. Without a stored durations file pytest-split falls
      # back to an even split by test count, which is close enough here.
      #
      # --durations=10 is visibility, not a gate: a timing assertion would go
      # flaky on a loaded runner, but a list of the slowest tests in the log is
      # what tells us when something has started to cost real money.
      - run: >-
          python -m pytest tests/ -q -n auto --durations=10
          --splits 4 --group ${{ matrix.shard }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # The one required check. A skipped job reports neither success nor failure,
  # so branch protection on `test` alone would leave a docs-only PR pending
  # forever; this collapses "passed or deliberately not run" into one green
  # tick and fails the moment anything that did run went red.
  ci:
    needs: [lint, test, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass"; exit 1 ;;
            esac
          done
