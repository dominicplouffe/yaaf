# yaaf — single-box deployment. This IS the primary target: agent runs are
# I/O-bound on someone else's inference, so rate limits arrive long before
# worker capacity does. Extra worker machines are a deploy choice, not an
# architecture change.
#
# Host prerequisite (sibling-container workspace mounts need identical
# host/container paths):
#   sudo mkdir -p /var/lib/yaaf/workspaces /var/lib/yaaf/artifacts
#
# ── running a second stack on one box ────────────────────────────────────────
# Everything this stack owns is named from YAAF_STACK, which defaults to
# "deploy" — the implicit compose project name, so an existing box sees no
# change at all. Set the four variables below in deploy/.env to stand a second
# stack beside a live one (a worktree testing a branch, or a staging box):
#
#   YAAF_STACK=modes                        # containers, volumes, network suffix
#   YAAF_STATE_ROOT=/var/lib/yaaf-modes     # workspaces, artifacts, proxy config
#   YAAF_SANDBOX_NETWORK=yaaf_sandbox_modes # sandboxes must not share a network
#   YAAF_SANDBOX_IMAGE=yaaf-sandbox:modes   # or the live stack's next run uses
#                                           # this branch's code, silently
#
# Each one is a real collision, not belt-and-braces: the network is declared
# with an explicit name so compose does NOT prefix it; the state root is bind
# mounted from fixed host paths that two runners would both write; and the
# sandbox image tag is read per-run, so rebuilding it under the shared tag
# changes the other stack's behaviour with no restart and no signal.
name: ${YAAF_STACK:-deploy}

services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: yaaf
      POSTGRES_PASSWORD: yaaf
      POSTGRES_DB: yaaf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaaf"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: yaaf-server
    environment:
      YAAF_DATABASE_URL: postgresql+psycopg://yaaf:yaaf@db:5432/yaaf
      YAAF_ADMIN_TOKEN: ${YAAF_ADMIN_TOKEN:-dev-admin-token}
      YAAF_MASTER_KEY: ${YAAF_MASTER_KEY:-}
      YAAF_API_BASE_URL: http://api:8080
      # Host path == container path, here as well as on the runner: the two
      # services share these directories and store absolute paths in the
      # database, so they have to agree on what a path means.
      YAAF_ARTIFACTS_ROOT: ${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts
      # S3 artifact store (optional): start minio with `docker compose --profile s3 up`
      # and uncomment these on BOTH api and runner. Local files stay the default.
      # YAAF_ARTIFACT_S3_ENDPOINT: http://minio:9000
      # YAAF_ARTIFACT_S3_BUCKET: yaaf-artifacts
      # YAAF_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-yaaf}
      # YAAF_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-yaaf-minio-dev}
    volumes:
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts:${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts
      # Read-only: the Files view lists and serves agents' work in progress;
      # only the runner (which owns the sandboxes) ever writes here.
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/workspaces:${YAAF_STATE_ROOT:-/var/lib/yaaf}/workspaces:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [default, sandbox]

  runner:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: yaaf-runner
    environment:
      YAAF_DATABASE_URL: postgresql+psycopg://yaaf:yaaf@db:5432/yaaf
      YAAF_API_BASE_URL: http://api:8080
      YAAF_MASTER_KEY: ${YAAF_MASTER_KEY:-}
      # Labels every sandbox and chat container this stack launches, so a
      # second stack never adopts, renames or reaps containers it does not own.
      YAAF_STACK: ${YAAF_STACK:-deploy}
      YAAF_SANDBOX_IMAGE: ${YAAF_SANDBOX_IMAGE:-yaaf-sandbox:latest}
      YAAF_SANDBOX_NETWORK: ${YAAF_SANDBOX_NETWORK:-yaaf_sandbox}
      YAAF_EGRESS_PROXY_URL: http://proxy:3128
      YAAF_WORKSPACES_ROOT: ${YAAF_STATE_ROOT:-/var/lib/yaaf}/workspaces
      YAAF_ARTIFACTS_ROOT: ${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts
      # Egress auto-apply: the runner regenerates the per-role squid config on
      # change and reloads squid (exec `squid -k reconfigure`; a container HUP
      # dies in the image's bash entrypoint) — UI edits reach squid, no CLI.
      YAAF_PROXY_GENERATED_DIR: ${YAAF_STATE_ROOT:-/var/lib/yaaf}/proxy-generated
      YAAF_PROXY_CONTAINER: ${YAAF_STACK:-deploy}-proxy-1
      # S3 artifact store (optional): keep in lockstep with the api service above.
      # YAAF_ARTIFACT_S3_ENDPOINT: http://minio:9000
      # YAAF_ARTIFACT_S3_BUCKET: yaaf-artifacts
      # YAAF_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-yaaf}
      # YAAF_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-yaaf-minio-dev}
    volumes:
      # The runner launches sibling sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host path == container path, so sibling mounts resolve identically.
      # Both sides move together under YAAF_STATE_ROOT for exactly that reason:
      # the runner hands these paths to the Docker daemon, which reads them as
      # HOST paths — a container path that differs would silently mount the
      # other stack's workspace.
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/workspaces:${YAAF_STATE_ROOT:-/var/lib/yaaf}/workspaces
      # Shared with the api service: run traces are stashed here at finalize.
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts:${YAAF_STATE_ROOT:-/var/lib/yaaf}/artifacts
      # Egress auto-apply writes here; the proxy reads the same dir read-only.
      # Outside the checkout on purpose: this is regenerated machine state, and
      # a running container must never dirty the working tree it was built from.
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/proxy-generated:${YAAF_STATE_ROOT:-/var/lib/yaaf}/proxy-generated
    depends_on:
      db:
        condition: service_healthy

  # Optional S3-compatible artifact store. Off by default — plain
  # `docker compose up` is unchanged; opt in with `docker compose --profile s3 up`
  # and uncomment the YAAF_ARTIFACT_S3_* lines on api and runner. The bucket is
  # created by yaaf on first use.
  minio:
    profiles: ["s3"]
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yaaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yaaf-minio-dev}
    volumes:
      - minio:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    restart: unless-stopped
    image: ubuntu/squid:latest
    # The image's default entrypoint exits silently with a custom config;
    # run the daemon in foreground explicitly.
    command: ["squid", "--foreground", "-f", "/etc/squid/squid.conf"]
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
      # Per-role ports + allowlists, written by `yaaf egress sync`; reload with
      # `docker exec <this container> squid -k reconfigure` after a sync
      # (NOT a container HUP — PID 1 is a bash entrypoint that swallows it).
      - ${YAAF_STATE_ROOT:-/var/lib/yaaf}/proxy-generated:/etc/squid/generated:ro
    networks: [default, sandbox]

networks:
  default: {}
  sandbox:
    # An explicit name, so compose does NOT prefix it with the project — which
    # means two stacks would otherwise share one network, and `compose down`
    # from either would pull it out from under the other. Worse, sandboxes
    # resolve the API by the hostname `api`: on a shared network a run from one
    # stack can reach the other stack's server.
    name: ${YAAF_SANDBOX_NETWORK:-yaaf_sandbox}
    internal: true   # sandbox containers reach the world ONLY through the proxy

volumes:
  pgdata: {}
  minio: {}
