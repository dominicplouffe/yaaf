# yaaf egress proxy: default-deny, allowlist only.
#
# Untrusted content + injected secrets + an open network is the standard lethal
# combination; this proxy is the third leg removed. Sandbox containers sit on an
# internal network whose only route out is this process.

http_port 3128

acl allowed_dst dstdomain "/etc/squid/allowlist.txt"
acl CONNECT method CONNECT
acl ssl_ports port 443
acl safe_ports port 80 443

# Per-role listening ports + allowlists, generated from the role library by
# `yaaf egress sync`. Placed after the acl definitions (squid needs them
# defined first) and before the global rules (http_access is positional).
include /etc/squid/generated/roles.conf

http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access allow allowed_dst
http_access deny all

# Keep logs useful for audit; do not cache anything.
cache deny all
access_log stdio:/dev/stdout squid

# Model API responses stream for a long time and can pause between events
# (extended thinking, long tool turns). Squid's default read_timeout of 15
# minutes cuts such a CONNECT tunnel mid-response and the run dies as
# "Connection lost mid-response". An idle tunnel held open longer is cheap;
# a killed stream is a re-billed turn.
read_timeout 60 minutes
